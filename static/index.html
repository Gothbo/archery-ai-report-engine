<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>射箭 AI 训练报告引擎</title>
<style>
  :root {
    /* CUX V1 tokens（六六）：正文黑 / 品牌蓝 / 页底；审计用 --accent 取更深品牌字色 */
    --bg: #EDF2F7;
    --page: #EDF2F7;
    --card: #ffffff;
    --header-bg: rgba(255,255,255,0.92);
    --text: #000000;
    --text-2: #5C6B82;
    /* --brand-500: #2098D8 — 装饰与 soft（分段选中条/色条/soft fill）；本文件用 --brand */
    --brand: #2098D8;
    --brand-600: #1A84C2;
    /* --brand-700 / --btn-solid: #136FA9 — 实心主按钮（WCAG，白字）；本文件用 --brand-700 与 --accent-solid */
    --brand-700: #136FA9;
    --brand-100: #E3F2FB;
    --brand-050: #F2F8FD;
    --accent: #136FA9;
    --accent-solid: #136FA9; /* = --btn-solid / brand-700：实心主按钮（WCAG，白字） */
    --accent-solid-hover: #0E6A9E;
    --accent-soft: #E3F2FB;
    --accent-line: #BFDFF2;
    --accent-ring: rgba(32,152,216,.28);
    --border: #E3E9F1;
    --row: #EEF2F7;
    --fill-1: #F6F9FC;
    --fill-2: #C9D3E0;
    --disabled-bg: #8593A8;
    --seg-thumb: #ffffff;
    --bubble: #F6F9FC;
    --card-soft: #F6F9FC;
    --surface-2: #F6F9FC;
    --danger: #E5484D;
    --warn: #B2501A;
    --ok: #22A55F;
    --mute: #8593A8;
    --radius: 16px;
    --radius-sm: 8px;
    --radius-xs: 8px;
    --shadow-1: 0 1px 2px rgba(16, 35, 78, 0.05);
    --shadow-2: 0 8px 24px rgba(16, 35, 78, 0.08);
  }
  /* ---- 暗色模式：仅覆盖 token，组件规则不动 ---- */
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #000000;
      --card: #1c1c1e;
      --header-bg: rgba(28,28,30,0.8);
      --text: #f5f5f7;
      --text-2: #98989d;
      --accent: #409cff;
      --accent-solid: #0a6ad0;
      --accent-solid-hover: #0a6fd6;
      --accent-soft: rgba(10,132,255,.14);
      --accent-line: rgba(10,132,255,.30);
      --accent-ring: rgba(10,132,255,.40);
      --border: #38383a;
      --fill-1: #2c2c2e;
      --fill-2: #48484a;
      --disabled-bg: #48484a;
      --seg-thumb: #636366;
      --bubble: #2c2c2e;
      --card-soft: #232325;
      --danger: #ff453a;
      --warn: #ff9f0a;
      --shadow-1: 0 1px 2px rgba(0,0,0,.5);
      --shadow-2: 0 8px 24px rgba(0,0,0,.6);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Inter, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--header-bg);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 17px; font-weight: 700; margin-right: auto; letter-spacing: -0.01em; }
  .segmented {
    display: inline-flex; background: var(--fill-1); border-radius: var(--radius-sm); padding: 2px;
  }
  .segmented button {
    border: none; background: transparent; padding: 6px 16px;
    font-size: 13px; color: var(--text-2); border-radius: 7px; cursor: pointer;
    font-family: inherit;
  }
  .segmented button.active { background: var(--seg-thumb); color: var(--text); font-weight: 700; box-shadow: var(--shadow-1); }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 60px; }
  .panel {
    background: var(--card); border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 18px 20px; margin-bottom: 16px;
    box-shadow: var(--shadow-1);
  }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  select, input, textarea {
    font-family: inherit; font-size: 14px; color: var(--text);
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 10px; outline: none;
    transition: border-color 150ms ease-out;
  }
  select:focus, input:focus, textarea:focus { border-color: var(--brand); }
  .label { font-size: 12px; color: var(--text-2); margin-right: -2px; }
  button.primary {
    font-family: inherit; font-size: 14px; font-weight: 700; color: #fff;
    background: var(--accent-solid); border: none; border-radius: var(--radius-sm);
    padding: 8px 18px; cursor: pointer;
    transition: background 150ms ease-out, transform 80ms ease-out;
  }
  button.primary:hover { background: var(--accent-solid-hover); }
  button.primary:active { transform: scale(0.98); }
  button.primary:disabled { background: var(--disabled-bg); cursor: default; }
  button.ghost {
    font-family: inherit; font-size: 13px; color: var(--text);
    background: #fff; border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 12px; cursor: pointer;
  }
  button.ghost:hover { border-color: var(--brand); background: var(--brand-050); }
  .granularity-bar { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .gran-btn {
    font-family: inherit; font-size: 13px; font-weight: 400;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 16px; cursor: pointer; color: var(--text);
    transition: border-color 150ms ease-out, background 150ms ease-out;
  }
  .gran-btn:hover { border-color: var(--brand); background: var(--brand-050); }
  .gran-btn.active { border-color: var(--brand); background: var(--brand-100); font-weight: 700; }
  .gran-btn:disabled { color: var(--mute); border-color: var(--row); cursor: default; }
  .section-title { font-size: 16px; font-weight: 700; margin-bottom: 10px; }
  .report-card { margin-bottom: 12px; }
  .report-card h3 { font-size: 13px; font-weight: 700; color: var(--text-2); margin-bottom: 6px; }
  .report-card p { font-size: 15px; line-height: 1.6; }
  .report-card p.notice {
    color: var(--text-2); font-size: 13px; line-height: 1.6;
    background: var(--card-soft); border: 1px solid var(--border);
    border-radius: var(--radius-xs); padding: 8px 10px; margin-top: 6px;
  }
  /* 风档对照：对齐小表（从 master 移植） */
  .report-card .wb-table {
    width: 100%; border-collapse: collapse; font-size: 13px;
    font-variant-numeric: tabular-nums; margin-top: 4px;
  }
  .report-card .wb-table th, .report-card .wb-table td {
    text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--row);
  }
  .report-card .wb-table th { font-size: 12px; font-weight: 700; color: var(--text-2); letter-spacing: .02em; }
  .report-card .wb-table th.num, .report-card .wb-table td.num { text-align: right; }
  .report-card .wb-table td.num { color: var(--text); font-weight: 700; }
  .report-card .wb-table tr:hover td { background: var(--brand-050); }
  .report-card .wb-table tr.dim td { opacity: 0.5; }
  .report-card .wb-table tbody tr:last-child td { border-bottom: none; }
  .meta { font-size: 12px; color: var(--text-2); margin-top: 12px; line-height: 1.7; }
  .empty {
    text-align: center; color: var(--text-2); font-size: 14px; padding: 48px 0;
  }
  .empty-report { text-align: left; padding: 8px 4px 4px; }
  .empty-report h2 { font-size: 18px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
  .empty-report p { font-size: 14px; line-height: 1.6; color: var(--text-2); margin-bottom: 12px; }
  .empty-hints { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .empty-hints li { font-size: 13px; color: var(--text); padding: 8px 12px; background: var(--card-soft); border: 1px solid var(--border); border-radius: 8px; }
  .empty-hints strong { font-weight: 700; color: var(--brand-700); margin-right: 4px; }
  .note { border-top: 1px solid var(--border); padding: 10px 0; display: flex; gap: 12px; align-items: baseline; }
  .note:first-child { border-top: none; }
  .note .type { font-size: 12px; color: var(--brand-700); font-weight: 700; min-width: 64px; }
  .note .content { font-size: 14px; line-height: 1.5; flex: 1; }
  .note .who { font-size: 12px; color: var(--text-2); min-width: 40px; text-align: right; }
  .note .del { font-size: 12px; color: #c7c7cc; background: none; border: none; cursor: pointer; font-family: inherit; }
  .note .del:hover { color: var(--danger); }
  .memory { font-size: 13px; line-height: 1.6; padding: 8px 0; border-top: 1px solid var(--border); }
  .memory:first-child { border-top: none; }
  .memory .k { color: var(--text-2); }
  .add-note { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .add-note select, .add-note input { flex: 1; min-width: 120px; }
  .add-note input.content-input { flex: 3; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 720px) { .two-col { grid-template-columns: 1fr; } }
  #status { font-size: 12px; color: var(--text-2); }
  /* ---- B1-6 对话窗：消息列表 / 折叠溯源 / 建议记录卡片（零依赖原生实现）---- */
  .chat-box { display: flex; flex-direction: column; gap: 10px; max-height: 420px; overflow-y: auto; padding: 4px 2px; }
  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .msg.assistant { justify-content: flex-start; }
  .bubble { max-width: 78%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.6; }
  .msg.user .bubble { background: var(--brand); color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--bubble); color: var(--text); border-bottom-left-radius: 4px; }
  .bubble .degraded { font-size: 12px; color: var(--warn); margin-top: 6px; }
  .chat-foot { display: flex; gap: 8px; margin-top: 12px; }
  .chat-foot input { flex: 1; }
  details.sources { margin-top: 8px; font-size: 12px; }
  details.sources summary { color: var(--text-2); cursor: pointer; user-select: none; }
  details.sources ul { margin: 6px 0 0; padding-left: 18px; color: var(--text-2); line-height: 1.7; }
  details.sources .src-type { color: var(--accent); font-weight: 600; }
  .note-card {
    margin-top: 8px; border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 12px; font-size: 12px; background: var(--card-soft);
  }
  .note-card .nc-head { color: var(--text-2); margin-bottom: 4px; }
  .note-card .nc-content { font-size: 13px; line-height: 1.5; }
  .note-card .nc-badge { float: right; color: var(--accent); font-size: 11px; }
  /* ---- PR #3 AI 训练指导：状态徽章 / 阶段进度 / 灰色草稿 / 正文（对齐 V17.2 §16.4 状态表）---- */
  .g-badge { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--card-soft); border: 1px solid var(--border); color: var(--text); }
  .g-badge.ok { background: #E8F7EE; border-color: rgba(34,165,95,0.35); color: var(--text); }
  .g-badge.run { background: var(--brand-100); border-color: rgba(32,152,216,0.35); color: var(--text); }
  .g-badge.err { background: #FDECEC; border-color: rgba(229,72,77,0.35); color: var(--text); }
  .g-badge.warn { background: #FFF4E0; border-color: rgba(240,160,32,0.4); color: var(--text); }
  .g-steps { font-size: 13px; color: #c7c7cc; margin-top: 10px; }
  .g-steps .on { color: var(--accent); font-weight: 600; }
  .g-steps .done { color: var(--text-2); }
  .g-body { margin-top: 10px; font-size: 15px; line-height: 1.7; white-space: pre-wrap; }
  .g-draft { color: var(--text-2); border: 1px dashed var(--border); border-radius: 10px; padding: 10px 14px; background: var(--card-soft); }
  .g-draft .g-tag { display: block; font-size: 12px; font-weight: 600; color: #6e6e73; margin-bottom: 4px; white-space: normal; }
  .g-draft .g-cursor::after { content: "▍"; animation: g-blink 1s steps(1) infinite; color: var(--accent); }
  @keyframes g-blink { 50% { opacity: 0; } }
  .g-hint { font-size: 13px; color: var(--text-2); white-space: normal; }
  .g-alert { font-size: 14px; border-radius: 10px; padding: 10px 14px; white-space: normal; }
  .g-alert.err { background: #fdf1f0; color: #8c1d18; }
  .g-alert.warn { background: #fff8e6; color: #5c3b00; }
  .g-code { font-size: 12px; color: var(--text-2); margin-top: 6px; }


  /* ---- MetricGrid（六六 V1：读 metrics.*）---- */
  .hero { margin-bottom: 4px; }
  .hero .card-sub { font-size: 13px; font-weight: 400; color: var(--text-2); margin: -4px 0 12px; }
  .metric-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 800px) { .metric-grid { grid-template-columns: repeat(2, 1fr); } }
  .metric {
    display: flex; flex-direction: column; gap: 4px; min-width: 0;
    background: var(--card-soft); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 12px 14px;
  }
  .metric .v {
    font-size: 36px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05;
    font-variant-numeric: tabular-nums; color: var(--text);
  }
  .metric .v .u { font-size: 14px; font-weight: 700; color: var(--text-2); margin-left: 2px; }
  .metric .l { font-size: 13px; font-weight: 400; color: var(--text-2); }
  .hero-foot { margin-top: 12px; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .hero-empty { padding: 20px 0 6px; font-size: 14px; color: var(--text-2); }

  .rh-range { display: block; margin-top: 4px; font-size: 12px; color: var(--muted, #6b7280); font-weight: 400; }
  .advice {
    margin: 10px 0; padding: 16px 18px; border-radius: var(--radius);
    background: var(--brand-050); border: 1px solid var(--brand-100);
  }
  .advice h3 { margin: 0 0 10px; font-size: 14px; font-weight: 700; color: var(--brand-700); }
  .advice ul { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .advice li { margin: 0; padding-left: 16px; position: relative; font-size: 14px; line-height: 1.6; color: var(--text); }
  .advice li::before {
    content: ''; position: absolute; left: 2px; top: .65em;
    width: 6px; height: 6px; border-radius: 50%; background: var(--brand);
  }
  .meta-line { display: flex; gap: 8px; font-size: 12px; color: #6b7280; margin: 2px 0; }
  .meta-line .mk { min-width: 64px; color: #9ca3af; }
  .anchor-setup { background: #fff7ed; border: 1px solid #fdba74; border-radius: 8px; padding: 12px; margin: 10px 0; }
  .anchor-setup h3 { margin: 0 0 6px; font-size: 14px; color: #9a3412; }
  .as-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .as-row select { flex: 1; }

  /* ---- 六六 V1：水平对比 / 环比 / 风档 gap / 证据 / 规则骨架 ---- */
  .verdict-table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  .verdict-table th {
    text-align: left; font-size: 12px; font-weight: 700; color: var(--text-2);
    padding: 8px 10px; border-bottom: 1px solid var(--border);
  }
  .verdict-table td {
    padding: 12px 10px; border-bottom: 1px solid var(--row); vertical-align: middle; color: var(--text);
  }
  .verdict-table tr:last-child td { border-bottom: none; }
  .verdict-table tr:hover td { background: var(--brand-050); }
  .verdict-table .num { font-weight: 700; font-size: 15px; }
  .delta-cell { display: flex; align-items: center; gap: 6px; font-weight: 700; }
  .arrow {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 999px; font-size: 12px; font-weight: 700;
  }
  .arrow.up, .arrow.down { background: #E8F7EE; }
  .arrow.flat, .arrow.na { background: #EEF1F5; }
  .chip {
    display: inline-block; font-size: 12px; font-weight: 700;
    padding: 3px 10px; border-radius: 999px; color: var(--text);
  }
  .chip.progress { background: #E8F7EE; box-shadow: inset 0 0 0 1px rgba(34,165,95,0.35); }
  .chip.regress { background: #FFF4E0; box-shadow: inset 0 0 0 1px rgba(240,160,32,0.4); }
  .chip.steady { background: #EEF1F5; box-shadow: inset 0 0 0 1px rgba(133,147,168,0.35); }
  .chip.pending { background: #EEF1F5; box-shadow: inset 0 0 0 1px rgba(133,147,168,0.35); }
  .reason { font-size: 12px; color: var(--text-2); margin-top: 4px; }

  .compare-strip {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    background: var(--brand-050); border: 1px solid var(--brand-100);
    border-radius: var(--radius-sm); padding: 14px 18px;
  }
  .compare-strip .big {
    font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
  }
  .compare-strip .desc { font-size: 14px; }
  .compare-strip .desc strong { font-weight: 700; }

  .gap-strip {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--card-soft); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 14px; font-size: 13px;
  }
  .gap-strip .tag {
    font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; color: var(--text);
    background: #FFF4E0; box-shadow: inset 0 0 0 1px rgba(240,160,32,0.35);
  }
  .gap-strip .tag.ok {
    background: #E8F7EE; box-shadow: inset 0 0 0 1px rgba(34,165,95,0.35);
  }

  details.evidence {
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--card); box-shadow: var(--shadow-1); margin: 12px 0 4px;
  }
  details.evidence > summary {
    cursor: pointer; user-select: none; list-style: none;
    padding: 14px 18px; font-size: 15px; font-weight: 700;
    display: flex; align-items: center; gap: 10px;
  }
  details.evidence > summary::-webkit-details-marker { display: none; }
  details.evidence > summary::after {
    content: '展开'; margin-left: auto; font-size: 12px; font-weight: 400; color: var(--text-2);
  }
  details.evidence[open] > summary::after { content: '收起'; }
  details.evidence > summary:hover { background: var(--brand-050); border-radius: var(--radius); }
  .ev-body { padding: 0 18px 16px; }
  .ev-table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  .ev-table th, .ev-table td { padding: 8px 10px; border-bottom: 1px solid var(--row); text-align: left; }
  .ev-table th { font-size: 12px; font-weight: 700; color: var(--text-2); }
  .ev-table td.num { text-align: right; font-weight: 700; }
  .ev-table th.num { text-align: right; }
  .ev-meta { margin-top: 12px; font-size: 13px; line-height: 1.7; color: var(--text-2); }
  .ev-meta .k { display: inline-block; min-width: 96px; color: var(--text-2); opacity: 0.85; }
  .ev-warn {
    margin-top: 10px; padding: 8px 12px; border-radius: 8px; font-size: 13px; color: var(--text);
    background: #FFF4E0; box-shadow: inset 0 0 0 1px rgba(240,160,32,0.35);
  }

  .rules-box {
    margin-top: 12px; background: var(--card-soft); border: 1px dashed var(--border);
    border-radius: var(--radius-sm); padding: 14px 16px;
  }
  .rules-box .rh {
    font-size: 13px; font-weight: 700; margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .rules-box .rh .pill {
    font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; color: var(--text);
    background: #EEF1F5; box-shadow: inset 0 0 0 1px rgba(133,147,168,0.35);
  }
  .rules-box ul { list-style: none; display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; }
  .rules-box li {
    font-size: 13px; line-height: 1.55; padding: 8px 10px; color: var(--text);
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); opacity: 0.75;
  }
  .rules-box li em { font-style: normal; font-weight: 700; font-size: 11px; color: var(--text-2); margin-left: 6px; }
  .basis-skel { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .skel {
    height: 10px; border-radius: 4px;
    background: linear-gradient(90deg, var(--row), #e8edf3, var(--row));
    background-size: 200% 100%; animation: sk 1.2s ease-in-out infinite;
  }
  @keyframes sk { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
  .block-title { font-size: 15px; font-weight: 700; margin: 4px 0 10px; }
  .block-title .sub { font-size: 12px; font-weight: 400; color: var(--text-2); margin-left: 8px; }
</style>
</head>
<body>
<header>
  <h1>射箭 AI 训练报告引擎</h1>
  <div class="segmented" id="viewSwitch">
    <button data-view="coach" class="active">教练视图</button>
    <button data-view="athlete">运动员视图</button>
  </div>
</header>

<main>
  <div class="panel">
    <div class="row">
      <span class="label">运动员</span>
      <select id="athleteSelect" style="min-width:180px"><option value="">加载中…</option></select>
      <span class="label" id="profileInfo"></span>
      <span id="status" style="margin-left:auto"></span>
    </div>
    <div class="row" style="margin-top:12px" id="windowRow">
      <span class="label">场次</span>
      <select id="sessionSelect" style="min-width:200px"></select>
    </div>
    <div class="granularity-bar">
      <button class="gran-btn" data-g="daily">日报告</button>
      <button class="gran-btn" data-g="weekly">周报告</button>
      <button class="gran-btn" data-g="monthly">月报告</button>
      <button class="gran-btn" data-g="quarterly">季报告</button>
      <button class="gran-btn" data-g="yearly">年报告</button>
      <input id="windowInput" style="width:130px;margin-left:8px" placeholder="窗口（默认当前）">
      <span class="label" id="windowHint"></span>
    </div>
  </div>

  <div id="reportPanel" class="panel" style="display:none">
    <div class="section-title" id="reportHead"></div>
    <div id="reportHero"></div>
    <div id="reportBody"></div>
    <div id="reportAdvice"></div>
    <div class="meta" id="reportMeta"></div>
  </div>
  <div id="reportEmpty" class="panel empty-report">
    <h2>选择运动员并生成报告</h2>
    <p>选定运动员与粒度后，点击上方日/周/月等按钮生成报告。满态将展示成绩 KPI、水平对比、环比与风档等结构化区块。</p>
    <ul class="empty-hints">
      <li><strong>1.</strong> 在上方选择运动员（如张明）</li>
      <li><strong>2.</strong> 选择日 / 周 / 月等粒度；窗口可留空取当前</li>
      <li><strong>3.</strong> 点击粒度按钮生成报告</li>
    </ul>
  </div>

  <!-- PR #3 AI 训练指导：一次生成绑定「当前报告 + 视角」；换报告 / 切视角 / 换运动员 = 取消并丢弃 -->
  <div id="guidancePanel" class="panel" style="display:none">
    <div class="row">
      <div class="section-title" style="margin:0">AI 训练指导</div>
      <span class="g-badge" id="gBadge">未生成</span>
      <span style="margin-left:auto" class="row">
        <button class="ghost" id="gCancelBtn" style="display:none">取消</button>
        <button class="primary" id="gGenBtn">生成AI指导</button>
      </span>
    </div>
    <div class="meta" id="gBasis" style="margin-top:6px"></div>
    <div id="gRulesSkeleton"></div>
    <div class="g-steps" id="gSteps" style="display:none">
      <span id="gStep1">① 正在读取数据</span> · <span id="gStep2">② 正在撰写</span> · <span id="gStep3">③ 核对数据</span>
      <span id="gElapsed" style="margin-left:8px;color:var(--text-2)"></span>
    </div>
    <div class="g-body" id="gBody"></div>
    <div class="row" id="gActions" style="display:none;margin-top:12px">
      <button class="primary" id="gRetryBtn">重试</button>
      <button class="ghost" id="gRulesBtn">只看规则建议</button>
    </div>
  </div>

  <div class="two-col">
    <div class="panel">
      <div class="section-title">备注</div>
      <div id="notesList"><div class="empty" style="padding:16px 0">暂无备注</div></div>
      <div class="add-note">
        <select id="noteType">
          <option value="injury">伤病</option>
          <option value="goal">训练目标</option>
          <option value="coach_note">教练观察</option>
        </select>
        <input id="noteContent" class="content-input" placeholder="录入内容…">
        <button class="primary" id="addNoteBtn">添加</button>
      </div>
    </div>
    <div class="panel">
      <div class="section-title">历史结论沉淀</div>
      <div id="memoriesList"><div class="empty" style="padding:16px 0">暂无结论沉淀</div></div>
    </div>
  </div>

  <div class="panel" id="chatPanel">
    <div class="section-title">对话问询</div>
    <div class="row" style="margin-bottom:10px">
      <span class="label">引用报告</span>
      <select id="chatReportSelect" style="min-width:220px"><option value="">加载中…</option></select>
    </div>
    <div class="chat-box" id="chatMessages">
      <div class="empty" style="padding:20px 0">选择运动员后，可就训练表现提问（需先生成一份报告）</div>
    </div>
    <div class="chat-foot">
      <input id="chatInput" placeholder="例如：这周为什么进步了？" maxlength="200">
      <button class="primary" id="chatSendBtn">发送</button>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let view = 'coach';
let athletes = [];
let athleteId = null;
let sessions = [];
let lastRequest = null; // 最近一次生成的粒度：切换视角时按新视角重取同一窗口

function api(path, opts) {
  return fetch(path, opts).then(async (res) => {
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || ('HTTP ' + res.status));
    return data;
  });
}

function isoWeek(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (date.getUTCDay() + 6) % 7;
  date.setUTCDate(date.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(date.getUTCFullYear(), 0, 4));
  const firstDayNum = (firstThursday.getUTCDay() + 6) % 7;
  firstThursday.setUTCDate(firstThursday.getUTCDate() - firstDayNum + 3);
  const week = 1 + Math.round((date - firstThursday) / (7 * 24 * 3600 * 1000));
  return date.getUTCFullYear() + '-W' + String(week).padStart(2, '0');
}

function currentWindow() {
  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth() + 1;
  const q = Math.floor((m - 1) / 3) + 1;
  return {
    week: isoWeek(now),
    month: y + '-' + String(m).padStart(2, '0'),
    quarter: y + 'Q' + q,
    year: String(y),
  };
}

function loadAthletes() {
  api('/api/v1/athletes').then((r) => {
    athletes = r.athletes || [];
    const sel = $('athleteSelect');
    sel.innerHTML = '';
    if (!athletes.length) {
      sel.innerHTML = '<option value="">（无运动员，请先导入数据）</option>';
      return;
    }
    athletes.forEach((a) => {
      const opt = document.createElement('option');
      opt.value = a.athlete_id;
      opt.textContent = (a.name || '未命名选手') + (a.bow_type ? ' · ' + a.bow_type : '');
      sel.appendChild(opt);
    });
    // 默认选中「最近有训练」的运动员：列表按姓名排序，取第一个可能落到久未训练的档案，
    // 打开即「样本不足」。last_session_utc 为空的排到最后。
    const pick = athletes.slice().sort((a, b) =>
      (b.last_session_utc || '').localeCompare(a.last_session_utc || '')
    )[0];
    sel.value = pick.athlete_id;
    onAthleteChange();
  }).catch((e) => { $('status').textContent = '加载失败：' + e.message; });
}

function onAthleteChange() {
  athleteId = $('athleteSelect').value;
  if (!athleteId) return;
  $('status').textContent = '加载中…';
  $('reportEmpty').style.display = '';
  $('reportPanel').style.display = 'none';
  lastRequest = null; // 换了运动员就丢弃上一份报告的窗口，避免切视角时误触发重取
  discardGuidance();  // 上一位运动员的在途指导：真取消并丢弃
  currentReport = null;
  $('guidancePanel').style.display = 'none';
  api('/api/v1/athletes/' + athleteId).then((r) => {
    const p = r.profile || {};
    const bits = [];
    if (p.level) bits.push(p.level);
    if (p.bow_type) bits.push(p.bow_type);
    if (p.age) bits.push(p.age + '岁');
    $('profileInfo').textContent = bits.join(' · ');
    $('status').textContent = '';
  }).catch(() => { $('status').textContent = ''; });

  api('/api/v1/athletes/' + athleteId + '/sessions').then((r) => {
    sessions = r.sessions || [];
    const sel = $('sessionSelect');
    sel.innerHTML = '';
    if (!sessions.length) {
      sel.innerHTML = '<option value="">（无场次）</option>';
      return;
    }
    sessions.slice().reverse().forEach((s) => {
      const opt = document.createElement('option');
      opt.value = s.session_id;
      const t = (s.session_time_utc || '').slice(0, 10);
      opt.textContent = s.session_id + ' · ' + t + ' · ' + (s.shot_count || 0) + '箭';
      sel.appendChild(opt);
    });
    sel.value = sessions[sessions.length - 1].session_id;
  });

  resetChat();
  refreshSidePanels();
  loadChatReports();
}

function resetChat() {
  // 换运动员必须清空问答：否则上一位运动员的对话留在屏幕上，容易被误读成本人的数据
  $('chatMessages').innerHTML =
    '<div class="empty" style="padding:20px 0">选择运动员后，可就训练表现提问（需先生成一份报告）</div>';
}

function refreshSidePanels() {
  if (!athleteId) return;
  api('/api/v1/athletes/' + athleteId + '/notes?view=' + view).then((r) => {
    const box = $('notesList');
    const notes = r.notes || [];
    if (!notes.length) { box.innerHTML = '<div class="empty" style="padding:16px 0">暂无备注</div>'; return; }
    box.innerHTML = notes.map((n) =>
      '<div class="note"><span class="type">' + typeLabel(n.note_type) + '</span>' +
      '<span class="content">' + esc(n.content) + '</span>' +
      '<span class="who">' + esc(n.author_role || '') + '</span>' +
      '<button class="del" data-id="' + n.id + '">删除</button></div>'
    ).join('');
    box.querySelectorAll('.del').forEach((b) => b.onclick = () => deleteNote(b.dataset.id));
  }).catch((e) => { $('notesList').innerHTML = '<div class="empty">加载失败</div>'; });

  api('/api/v1/athletes/' + athleteId + '/memories').then((r) => {
    const box = $('memoriesList');
    const ms = r.memories || [];
    if (!ms.length) { box.innerHTML = '<div class="empty" style="padding:16px 0">暂无结论沉淀</div>'; return; }
    box.innerHTML = ms.slice(0, 8).map((m) =>
      '<div class="memory"><span class="k">' + (G_NAMES[m.granularity] || m.granularity) +
      (m.window_key ? ' · ' + esc(windowLabel(m)) : '') + '</span>：' +
      esc(m.conclusion || m.summary || '') + '</div>'
    ).join('');
  }).catch(() => {});
}

function typeLabel(t) {
  return { injury: '伤病', goal: '目标', coach_note: '教练观察' }[t] || t;
}

/* ---- B1-6 对话窗：引用已生成报告 → ask → 回答 + 折叠溯源 + 建议记录卡片 ---- */
const G_NAMES = { daily: '日', weekly: '周', monthly: '月', quarterly: '季', yearly: '年' };
let chatReports = [];

function windowLabel(x) {
  const k = String(x.window_key || '');
  return x.granularity === 'daily' ? k.replace(/^daily:/, '') : k;
}

function loadChatReports(preferKey) {
  if (!athleteId) return;
  const sel = $('chatReportSelect');
  const prev = chatReports[parseInt(sel.value, 10)];
  const keepKey = preferKey || (prev ? prev.granularity + '|' + prev.window_key : '');
  sel.innerHTML = '<option value="">加载中…</option>';
  api('/api/v1/athletes/' + athleteId + '/reports').then((r) => {
    // 同一窗口只保留最新一份：重生成会留下多行缓存，否则下拉被重复项撑爆（实测周报重复 37 条）。
    // 接口按 generated_at_utc DESC 返回，故每个窗口首次出现即为最新。
    const seen = {};
    chatReports = (r.reports || []).filter((x) => {
      const k = x.granularity + '|' + x.window_key;
      if (seen[k]) return false;
      seen[k] = true;
      return true;
    });
    if (!chatReports.length) {
      sel.innerHTML = '<option value="">（请先生成一份报告）</option>';
      $('chatSendBtn').disabled = true;
      return;
    }
    sel.innerHTML = chatReports.map((x, i) =>
      '<option value="' + i + '">' + (G_NAMES[x.granularity] || x.granularity) + ' · ' +
      esc(windowLabel(x)) + ' · ' + esc((x.generated_at_utc || '').slice(0, 10)) + '</option>'
    ).join('');
    // 优先选中刚生成的那份；否则沿用原选中项；再否则取最新一份
    let idx = -1;
    if (keepKey) chatReports.forEach((x, i) => {
      if (idx < 0 && x.granularity + '|' + x.window_key === keepKey) idx = i;
    });
    sel.value = String(idx >= 0 ? idx : 0);
    $('chatSendBtn').disabled = false;
  }).catch(() => {
    sel.innerHTML = '<option value="">（加载失败）</option>';
    $('chatSendBtn').disabled = true;
  });
}

function sendChat() {
  const q = $('chatInput').value.trim();
  if (!q || !athleteId || $('chatSendBtn').disabled) return;
  $('chatInput').value = '';
  addMsg('user', q);
  const pending = addMsg('assistant', '思考中…');
  const body = { question: q, view: view };
  const rep = chatReports[parseInt($('chatReportSelect').value, 10)];
  if (rep) { body.granularity = rep.granularity; body.window_key = rep.window_key; }
  api('/api/v1/athletes/' + athleteId + '/ask', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  }).then((resp) => {
    pending.innerHTML = renderAnswer(resp);
    scrollChat();
  }).catch((e) => {
    pending.innerHTML = '<span class="degraded">问询失败：' + esc(e.message) + '</span>';
  });
}

function addMsg(role, text) {
  const box = $('chatMessages');
  const empty = box.querySelector('.empty');
  if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  div.appendChild(bubble);
  box.appendChild(div);
  scrollChat();
  return bubble;
}

function renderAnswer(resp) {
  // 调用方（addMsg）返回的就是 .bubble 容器，这里只填内容，
  // 否则会渲染成 bubble 套 bubble，答案被套上两层内边距
  const html = [];
  html.push(esc(resp.answer || ''));
  if (resp.degraded) {
    const reason = resp.reason || '';
    html.push('<div class="degraded">降级：' + esc(reason) + '</div>');
  }
  const srcs = resp.sources || [];
  if (srcs.length) {
    html.push('<details class="sources"><summary>溯源（' + srcs.length + '）</summary><ul>');
    srcs.forEach((s) => {
      html.push('<li><span class="src-type">' + esc(s.type || '') + '</span> · ' +
        esc(s.title || '') + '<br>' + esc((s.summary || '').slice(0, 120)) + '</li>');
    });
    html.push('</ul></details>');
  }
  const sn = resp.suggested_note;
  if (sn) {
    html.push('<div class="note-card"><span class="nc-badge">只读建议</span>' +
      '<div class="nc-head">' + esc(typeLabel(sn.note_type)) + ' · 来源 ' + esc(sn.source || '') + '</div>' +
      '<div class="nc-content">' + esc(sn.content) + '</div></div>');
  }
  return html.join('');
}

function scrollChat() {
  const box = $('chatMessages');
  box.scrollTop = box.scrollHeight;
}

$('chatSendBtn').onclick = sendChat;
$('chatInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChat(); });

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function windowParams(g) {
  const manual = $('windowInput').value.trim();
  if (g === 'daily') return { session_id: $('sessionSelect').value || '' };
  if (manual) {
    const hints = { weekly: '2026-W34', monthly: '2026-08', quarterly: '2026Q3', yearly: '2026' };
    $('windowHint').textContent = '格式：' + hints[g];
    return { [g === 'weekly' ? 'week' : g === 'monthly' ? 'month' : g === 'quarterly' ? 'quarter' : 'year']: manual };
  }
  const w = currentWindow();
  $('windowHint').textContent = '';
  if (g === 'weekly') return { week: w.week };
  if (g === 'monthly') return { month: w.month };
  if (g === 'quarterly') return { quarter: w.quarter };
  return { year: w.year };
}

function generate(g) {
  if (!athleteId) return;
  const p = windowParams(g);
  const qs = new URLSearchParams({ view: view, refresh: '1', ...p }).toString();
  $('status').textContent = '生成中…';
  api('/api/v1/athletes/' + athleteId + '/reports/' + g + '?' + qs, { method: 'POST' })
    .then((r) => {
      lastRequest = g;
      renderReport(r);
      // 生成后立刻刷新「引用报告」下拉并选中这份：否则新报告不在列表里，
      // 此前没有任何报告时对话输入框会一直处于禁用状态。
      loadChatReports(r.granularity ? r.granularity + '|' + r.window_key : '');
      $('status').textContent = r.cached ? '已读取缓存' : '已生成';
    })
    .catch((e) => { $('status').textContent = ''; alert('生成失败：' + e.message); });
}

document.querySelectorAll('.gran-btn').forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll('.gran-btn').forEach((x) => x.classList.remove('active'));
    b.classList.add('active');
    $('windowHint').textContent = '';
    generate(b.dataset.g);
  };
});

function windowRange(r) {
  if (!r || !r.window_start || !r.window_end) return '';
  const fmt = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit'
  });
  const s = new Date(r.window_start), e0 = new Date(r.window_end);
  if (isNaN(s) || isNaN(e0)) return '';
  const sd = fmt.format(s), ed = fmt.format(new Date(e0.getTime() - 1));
  return (sd === ed ? sd : sd + ' ~ ' + ed) + '（北京时间）';
}

// ---- 六六 V1：结构化 metrics / conclusions（保留 prose 解析作回退）----
function parseMetrics(line) {
  const nMatch = line.match(/[（(]\s*n\s*=\s*(\d+)\s*[）)]/);
  const body = line.replace(/[（(]\s*n\s*=\s*\d+\s*[）)]/, '').trim();
  const parts = body.split(/[，,]/).map((s) => s.trim()).filter(Boolean);
  if (parts.length < 2) return null;
  const items = [];
  for (const p of parts) {
    const mm = p.match(/^(.+?)\s*([\d.]+)\s*(%?)$/);
    if (!mm) return null;
    items.push({ label: mm[1].trim(), value: mm[2], unit: mm[3] || '' });
  }
  return { items, n: nMatch ? nMatch[1] : null };
}

function fmtNum(v, digits) {
  if (v == null || v === '' || Number.isNaN(Number(v))) return '—';
  const n = Number(v);
  return Number.isInteger(digits) ? n.toFixed(digits) : String(n);
}

function fmtSignedFixed(v, digits, unit) {
  if (v == null || Number.isNaN(Number(v))) return '—';
  const n = Number(v);
  const core = (n > 0 ? '+' : (n < 0 ? '−' : '')) + Math.abs(n).toFixed(digits);
  return core + (unit || '');
}

function fmtShanghai(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return String(iso);
  const parts = new Intl.DateTimeFormat('zh-CN', {
    timeZone: 'Asia/Shanghai',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
  }).formatToParts(d);
  const get = (t) => (parts.find((p) => p.type === t) || {}).value || '';
  return get('year') + '-' + get('month') + '-' + get('day') + ' ' +
    get('hour') + ':' + get('minute') + ':' + get('second') + '（Asia/Shanghai）';
}

function metricGrid(parsed) {
  const card = document.createElement('div');
  card.className = 'hero';
  const grid = document.createElement('div');
  grid.className = 'metric-grid';
  parsed.items.forEach((it) => {
    const el = document.createElement('div');
    el.className = 'metric';
    el.innerHTML = '<div class="v">' + esc(it.value) +
      (it.unit ? '<span class="u">' + esc(it.unit) + '</span>' : '') + '</div>' +
      '<div class="l">' + esc(it.label) + '</div>';
    grid.appendChild(el);
  });
  card.appendChild(grid);
  if (parsed.n) {
    const foot = document.createElement('div');
    foot.className = 'hero-foot';
    foot.textContent = '样本 ' + parsed.n + ' 箭';
    card.appendChild(foot);
  }
  return card;
}

/** 优先读 r.metrics；缺失时回退 window_score 散文解析（不删旧路径） */
function metricGridFromMetrics(m) {
  if (!m || typeof m !== 'object') return null;
  const items = [
    { label: '均环', value: fmtNum(m.avg_score, 2), unit: '' },
    { label: '有效均环', value: fmtNum(m.effective_avg_score, 2), unit: '' },
    { label: '内十率', value: fmtNum(m.inner10_rate, 1), unit: '%' },
    { label: '命中率', value: fmtNum(m.hit_rate, 1), unit: '%' },
    { label: '散布', value: fmtNum(m.dispersion_mm, 1), unit: 'mm' },
    { label: '撒放', value: fmtNum(m.mcr_t, 3), unit: 's' },
    { label: '心率波动', value: fmtNum(m.hr_volatility, 1), unit: 'bpm' },
    { label: 'n箭', value: m.n_shots != null ? String(m.n_shots) : '—', unit: '' },
  ];
  if (items.every((it) => it.value === '—')) return null;
  const wrap = document.createElement('div');
  wrap.className = 'hero';
  wrap.innerHTML = '<div class="block-title">成绩<span class="sub">来自 metrics</span></div>';
  const grid = metricGrid({ items, n: null });
  wrap.appendChild(grid.querySelector('.metric-grid'));
  return wrap;
}

/* 风档对照：优先 evidence.wind_band_avg；否则解析「…档：均环 X（n=Y）」 */
const NOTICE_RE = /无风速数据|无心率数据|空窗口|不可用|未计入|数据存疑|暂无可|暂无|样本不足|样本偏少|无锚点|降级期/;
const WB_RE = /^(.*?档)\s*[：:]\s*均环\s*([\d.]+)\s*[（(]\s*n\s*=\s*(\d+)\s*[）)]\s*$/;
const WIND_BAND_LABELS = {
  '0': '[0.0, 1.5)',
  '1': '[1.5, 2.0)',
  '2': '[2.0, 2.5)',
  '3': '≥ 2.5',
};

function windGapStrip(wg) {
  if (!wg || typeof wg !== 'object') return null;
  const el = document.createElement('div');
  el.className = 'gap-strip';
  if (wg.status && wg.status !== 'ok') {
    el.innerHTML = '<span class="tag">wind_gap</span><span>' + esc(wg.status) +
      (wg.reason ? ' · ' + esc(wg.reason) : '') + '</span>';
    return el;
  }
  const tags = [];
  if (wg.provisional) tags.push('<span class="tag">provisional</span>');
  if (wg.triggered) tags.push('<span class="tag">已触发</span>');
  else tags.push('<span class="tag ok">未触发</span>');
  const gap = wg.gap != null ? fmtNum(wg.gap, 2) : '—';
  const thr = wg.threshold != null ? fmtNum(wg.threshold, 2) : '—';
  const low = wg.low || {};
  const high = wg.high || {};
  const split = wg.split_mps != null ? fmtNum(wg.split_mps, 1) : '—';
  el.innerHTML = tags.join('') +
    '<span>高低风均环差 <strong style="font-weight:700">gap ' + esc(gap) +
    '</strong>（阈值 ' + esc(thr) + ' · ' + (wg.triggered ? '已触发' : '未触发') + '）</span>' +
    '<span style="color:var(--text-2)">低风(&lt;' + esc(split) + ' m/s) ' +
    esc(fmtNum(low.avg_score, 2)) + ' / n=' + esc(low.n_shots != null ? low.n_shots : '—') +
    ' · 高风 ' + esc(fmtNum(high.avg_score, 2)) + ' / n=' +
    esc(high.n_shots != null ? high.n_shots : '—') + '</span>';
  return el;
}

function windBandsCard(s, evidenceBands, windGap) {
  const card = document.createElement('div');
  card.className = 'report-card';
  const h = document.createElement('div');
  h.className = 'block-title';
  h.innerHTML = esc(s && s.title ? s.title : '风档对照') +
    '<span class="sub">sections.wind_bands + conclusions.wind_gap</span>';
  card.appendChild(h);

  const gapEl = windGapStrip(windGap);
  if (gapEl) card.appendChild(gapEl);

  let rows = [];
  const bandVal = evidenceBands && evidenceBands[0] && evidenceBands[0].value;
  if (bandVal && typeof bandVal === 'object') {
    const proseList = [];
    ((s && s.content) || []).forEach((c) => {
      const m = c.match(WB_RE);
      if (m) proseList.push({ band: m[1], avg: m[2], n: m[3] });
    });
    Object.keys(WIND_BAND_LABELS).forEach((k, i) => {
      if (bandVal[k] == null && bandVal[Number(k)] == null) return;
      const avg = bandVal[k] != null ? bandVal[k] : bandVal[Number(k)];
      const prose = proseList[i] || {};
      const n = prose.n;
      const note = (k === '3' && n != null && Number(n) < 15) ? '样本偏少，未参与风档比较' : '—';
      rows.push({
        band: WIND_BAND_LABELS[k],
        avg: fmtNum(avg, 3),
        n: n != null ? n : '—',
        note: note,
        dim: k === '3' && n != null && Number(n) < 15,
      });
    });
  }

  if (!rows.length) {
    ((s && s.content) || []).forEach((c) => {
      const m = c.match(WB_RE);
      if (m) {
        rows.push({ band: m[1], avg: m[2], n: m[3], note: '—', dim: false });
      } else {
        const p = document.createElement('p');
        p.textContent = c;
        if (NOTICE_RE.test(c)) p.className = 'notice';
        card.appendChild(p);
      }
    });
  }

  if (rows.length) {
    const t = document.createElement('table');
    t.className = 'wb-table';
    t.innerHTML = '<thead><tr><th>风档 (m/s)</th><th class="num">均环</th><th class="num">箭数 n</th><th>备注</th></tr></thead>';
    const tb = document.createElement('tbody');
    rows.forEach((r) => {
      const tr = document.createElement('tr');
      if (r.dim) tr.className = 'dim';
      tr.innerHTML = '<td>' + esc(r.band) + '</td><td class="num">' + esc(r.avg) +
        '</td><td class="num">' + esc(r.n) + '</td><td>' + esc(r.note || '—') + '</td>';
      tb.appendChild(tr);
    });
    t.appendChild(tb);
    card.appendChild(t);
  }
  return card;
}

const VERDICT_META = {
  avgScore: { name: '平均环', unit: '', digits: 2, lowerBetter: false },
  mcrT: { name: '撒放用时', unit: ' s', digits: 3, lowerBetter: true },
  dispersionMm: { name: '散布', unit: ' mm', digits: 1, lowerBetter: true },
  hrVolatility: { name: '心率波动', unit: ' bpm', digits: 1, lowerBetter: true },
};
const VERDICT_ORDER = ['avgScore', 'mcrT', 'dispersionMm', 'hrVolatility'];
const VERDICT_CHIP = {
  progress: { cls: 'progress', text: '进步' },
  regression: { cls: 'regress', text: '退步' },
  steady: { cls: 'steady', text: '持平' },
};
const REASON_ZH = {
  mdc_pending: 'MDC 阈值待专家共识，暂未判定',
  above_mdc: '',
  below_mdc: '',
  within_mdc: '',
  no_anchor: '无锚点，无法判定',
  insufficient_sample: '样本不足，暂未判定',
};

function verdictsCard(verdicts, anchorHint) {
  if (!verdicts || typeof verdicts !== 'object') return null;
  const card = document.createElement('div');
  card.className = 'report-card';
  const sub = anchorHint ? ('相对锚点 ' + anchorHint) : 'conclusions.verdicts';
  card.innerHTML = '<div class="block-title">水平对比<span class="sub">' + esc(sub) + '</span></div>';
  const table = document.createElement('table');
  table.className = 'verdict-table';
  table.innerHTML = '<thead><tr><th>指标</th><th>当前</th><th>变化</th><th>锚点</th><th>判定</th></tr></thead>';
  const tb = document.createElement('tbody');
  VERDICT_ORDER.forEach((key) => {
    const v = verdicts[key];
    if (!v) return;
    const meta = VERDICT_META[key] || { name: key, unit: '', digits: 2, lowerBetter: false };
    const verdict = v.verdict;
    const chip = verdict == null
      ? { cls: 'pending', text: '未判定' }
      : (VERDICT_CHIP[verdict] || { cls: 'pending', text: String(verdict) });
    let arrowCls = 'na';
    let arrowSym = '—';
    if (verdict === 'progress') {
      arrowCls = meta.lowerBetter ? 'down' : 'up';
      arrowSym = meta.lowerBetter ? '↓' : '↑';
    } else if (verdict === 'regression') {
      arrowCls = meta.lowerBetter ? 'up' : 'down';
      arrowSym = meta.lowerBetter ? '↑' : '↓';
    } else if (verdict === 'steady') {
      arrowCls = 'flat';
      arrowSym = '—';
    }
    const reason = REASON_ZH[v.reason] != null ? REASON_ZH[v.reason] : (v.reason || '');
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td>' + esc(meta.name) + '</td>' +
      '<td class="num">' + esc(fmtNum(v.value, meta.digits) + meta.unit) + '</td>' +
      '<td><div class="delta-cell"><span class="arrow ' + arrowCls + '">' + arrowSym +
      '</span><span>' + esc(fmtSignedFixed(v.delta, meta.digits, meta.unit)) + '</span></div>' +
      (verdict == null && reason ? '<div class="reason">' + esc(reason) + '</div>' : '') +
      '</td>' +
      '<td class="num">' + esc(fmtNum(v.anchor, meta.digits) + meta.unit) + '</td>' +
      '<td><span class="chip ' + chip.cls + '">' + esc(chip.text) + '</span></td>';
    tb.appendChild(tr);
  });
  table.appendChild(tb);
  card.appendChild(table);
  return card;
}

function selfCompareCard(sc) {
  if (!sc || typeof sc !== 'object') return null;
  const card = document.createElement('div');
  card.className = 'report-card';
  card.innerHTML = '<div class="block-title">环比<span class="sub">conclusions.self_compare</span></div>';
  const strip = document.createElement('div');
  strip.className = 'compare-strip';
  if (sc.status && sc.status !== 'ok') {
    strip.innerHTML = '<div class="desc">环比不可用：' + esc(sc.status) +
      (sc.reason ? ' · ' + esc(sc.reason) : '') + '</div>';
    card.appendChild(strip);
    return card;
  }
  const prev = sc.previous || {};
  const dir = sc.direction;
  let arrow = '—';
  if (dir === 'higher') arrow = '↑';
  else if (dir === 'lower') arrow = '↓';
  strip.innerHTML =
    '<div><div class="label" style="margin-bottom:4px">较上一窗口</div>' +
    '<div class="desc"><strong>vs ' + esc(prev.window_key || '—') + '</strong>（' +
    esc(prev.n_shots != null ? prev.n_shots : '—') + ' 箭 · 均环 ' +
    esc(fmtNum(prev.avg_score, 2)) + '）</div></div>' +
    '<div style="margin-left:auto;text-align:right">' +
    '<div class="label">均环变化</div>' +
    '<div class="big">' + esc(arrow + ' ' + fmtSignedFixed(sc.delta, 2, '')) + '</div>' +
    '<div class="desc" style="color:var(--text-2)">direction: ' + esc(dir || '—') + '</div></div>';
  card.appendChild(strip);
  return card;
}

function adviceCard(suggestions) {
  const card = document.createElement('div');
  card.className = 'advice';
  card.innerHTML = '<h3>训练建议</h3><ul>' +
    suggestions.map((t) => '<li>' + esc(t) + '</li>').join('') + '</ul>';

}

function anchorSetupCard(setup) {
  const card = document.createElement('div');
  card.className = 'anchor-setup';
  let html = '<h3>建立锚点</h3><p>' + esc(setup.reason || '当前无锚点，无法判定方向。') + '</p>';
  const cands = setup.candidates || [];
  if (!cands.length) {
    html += '<p>暂无可作锚点的场次（需早于当前窗口、含距离信息，且记分箭达最小样本）。</p>';
    card.innerHTML = html;
    return card;
  }
  card.innerHTML = html + '<div class="as-row"><select id="anchorCand"></select>' +
    '<button class="primary" id="anchorBtn">建立锚点</button></div>';
  const sel = card.querySelector('#anchorCand');
  cands.forEach((c) => {
    const o = document.createElement('option');
    o.value = c.session_id;
    o.textContent = (c.session_time_utc || '').slice(0, 10) + ' · ' + (c.distance_m || '?') + 'm · ' +
      (c.scoring_shots || 0) + '箭';
    sel.appendChild(o);
  });
  card.querySelector('#anchorBtn').onclick = () => {
    const btn = card.querySelector('#anchorBtn');
    btn.disabled = true;
    api('/api/v1/athletes/' + athleteId + '/baseline/anchor', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bow_type: setup.primary_bow, source_session_id: sel.value }),
    }).then(() => { $('status').textContent = '锚点已建立'; if (typeof lastRequest !== 'undefined' && lastRequest) generate(lastRequest); })
      .catch((e) => { btn.disabled = false; alert('建立锚点失败：' + e.message); });
  };
  return card;
}

function coachEvidenceCard(ce) {
  if (view !== 'coach' || !ce) return null;
  const levelEv = ((ce.evidence || {}).level) || [];
  const hasLevel = levelEv.length > 0;
  const rb = ce.rolling_baseline;
  const warnings = ce.warnings || [];
  // 运动员视角已由 view 拦截；教练但无 evidence/基线/警告时不渲染空壳
  if (!hasLevel && !rb && !warnings.length && !ce.anchor_rebuild_hint) return null;
  const details = document.createElement('details');
  details.className = 'evidence';
  details.innerHTML = '<summary>证据（教练） <span style="font-size:12px;font-weight:400;color:var(--text-2)">coach_extra.evidence</span></summary>';
  const body = document.createElement('div');
  body.className = 'ev-body';
  if (hasLevel) {
    const t = document.createElement('table');
    t.className = 'ev-table';
    t.innerHTML = '<thead><tr><th>指标</th><th class="num">now</th><th class="num">ref</th>' +
      '<th class="num">delta</th><th class="num">mdc</th><th>锚点日</th></tr></thead>';
    const tb = document.createElement('tbody');
    levelEv.forEach((row) => {
      if (!row || row.ref == null) return;
      const v = row.value || {};
      const tr = document.createElement('tr');
      const delta = v.delta;
      const deltaStr = delta == null ? '—' : fmtSignedFixed(delta, Math.abs(Number(delta)) < 1 ? 3 : 2, '');
      tr.innerHTML = '<td>' + esc(row.ref) + '</td>' +
        '<td class="num">' + esc(v.now != null ? v.now : '—') + '</td>' +
        '<td class="num">' + esc(v.ref != null ? v.ref : '—') + '</td>' +
        '<td class="num">' + esc(deltaStr) + '</td>' +
        '<td class="num">' + esc(v.mdc != null ? v.mdc : '—') + '</td>' +
        '<td>' + esc(v.ref_date || '—') + '</td>';
      tb.appendChild(tr);
    });
    t.appendChild(tb);
    body.appendChild(t);
  } else {
    const p = document.createElement('p');
    p.className = 'hero-empty';
    p.textContent = '暂无水平对比证据行';
    body.appendChild(p);
  }
  const meta = document.createElement('div');
  meta.className = 'ev-meta';
  const lines = [];
  if (rb) {
    lines.push('<div><span class="k">滚动基线</span> n=' + esc(rb.n_shots) +
      ' · 均环 ' + esc(rb.avg_score) +
      (rb.collected_at_utc ? ' · 采集 ' + esc(fmtShanghai(rb.collected_at_utc)) : '') + '</div>');
  }
  const hint = ce.anchor_rebuild_hint;
  if (hint && hint.reason) {
    lines.push('<div><span class="k">锚点提示</span> ' + esc(hint.reason) + '</div>');
  }
  meta.innerHTML = lines.join('');
  if (lines.length) body.appendChild(meta);
  if (warnings.length) {
    const w = document.createElement('div');
    w.className = 'ev-warn';
    w.textContent = '警告：' + warnings.join('；');
    body.appendChild(w);
  }
  details.appendChild(body);
  return details;
}

function rulesSkeletonHtml(report) {
  const rg = (report && report.rule_guidance) || null;
  const sug = (report && report.suggestions) || [];
  let title = (rg && rg.title) || '规则引擎智能指导';
  let summary = rg ? (rg.summary || '') : '';
  let bullets = (rg && Array.isArray(rg.bullets)) ? rg.bullets : null;
  if (!bullets) {
    bullets = sug.map((t) => ({ text: t, source: 'advice' }));
  }
  const emptyReason = rg ? rg.empty_reason : (sug.length ? null : 'no_signals');
  let pill = '规则引擎';
  if (emptyReason === 'no_shots') pill = '无箭';
  else if (emptyReason === 'data_suspect') pill = '数据存疑';
  else if (emptyReason === 'no_signals') pill = '无触发';
  else if (bullets.length) pill = bullets.length + ' 条';

  let body;
  if (!bullets.length) {
    const emptyMsg = summary || '本窗口暂无规则建议';
    body = '<p class="g-hint" style="margin:0">' + esc(emptyMsg) + '</p>';
  } else {
    const sumHtml = summary
      ? '<p class="g-hint" style="margin:0 0 10px">' + esc(summary) + '</p>'
      : '';
    body = sumHtml + '<ul>' +
      bullets.map((b) => {
        const text = (b && b.text != null) ? b.text : String(b);
        const src = (b && b.source) ? (' <em>' + esc(b.source) + '</em>') : '';
        return '<li>' + esc(text) + src + '</li>';
      }).join('') + '</ul>';
  }
  return '<div class="rules-box"><div class="rh">' + esc(title) +
    ' <span class="pill">' + esc(pill) + '</span></div>' + body + '</div>';
}

function renderReport(r) {
  $('reportEmpty').style.display = 'none';
  $('reportPanel').style.display = '';
  discardGuidance();
  currentReport = r;
  $('guidancePanel').style.display = '';
  gIdle();
  const names = { daily: '日', weekly: '周', monthly: '月', quarterly: '季', yearly: '年' };
  const who = r.athlete ? (r.athlete.name || '未命名选手') : '';
  const rng = windowRange(r);
  const wk = r.granularity === 'daily' ? String(r.window_key || '').replace(/^daily:/, '') : r.window_key;
  const genLocal = r.generated_at_utc ? fmtShanghai(r.generated_at_utc) : '';
  $('reportHead').innerHTML =
    esc(who) + ' · ' + esc(names[r.granularity] || r.granularity) + '报 ' + esc(wk) +
    (view === 'coach' ? ' · 教练视角' : ' · 运动员视角') +
    (genLocal ? '<span class="rh-range">生成时间 ' + esc(genLocal) +
      (r.bow_type ? ' · 弓种 ' + esc(r.bow_type) : '') +
      (r.metrics && r.metrics.n_shots != null ? ' · 窗口箭数 ' + esc(r.metrics.n_shots) : '') +
      '</span>' : (rng ? '<span class="rh-range">' + esc(rng) + '</span>' : ''));

  const byKey = {};
  (r.sections || []).forEach((s) => { byKey[s.key] = s; });
  const conclusions = r.conclusions || {};
  const ce = r.coach_extra || {};

  const hero = $('reportHero');
  hero.innerHTML = '';
  const fromMetrics = metricGridFromMetrics(r.metrics);
  if (fromMetrics) {
    const title = fromMetrics.querySelector('.block-title');
    if (title) title.childNodes[0].textContent = (names[r.granularity] || '') + '成绩';
    hero.appendChild(fromMetrics);
  } else {
    const ws = byKey['window_score'];
    if (ws) {
      const line = (ws.content || [])[0] || '';
      const parsed = parseMetrics(line);
      if (parsed) hero.appendChild(metricGrid(parsed));
      else {
        const el = document.createElement('div');
        el.className = 'hero-empty';
        el.textContent = line || '本窗口无箭';
        hero.appendChild(el);
      }
    }
  }

  const body = $('reportBody');
  body.innerHTML = '';

  let anchorDate = '';
  const levelEv = ((ce.evidence || {}).level) || [];
  if (levelEv[0] && levelEv[0].value && levelEv[0].value.ref_date) {
    anchorDate = levelEv[0].value.ref_date;
  }
  const vCard = verdictsCard(conclusions.verdicts, anchorDate);
  if (vCard) {
    body.appendChild(vCard);
    if (view === 'coach') {
      const setup = ce.anchor_setup;
      if (setup && setup.needs_anchor) body.appendChild(anchorSetupCard(setup));
    }
  } else if (byKey['level']) {
    const s = byKey['level'];
    const card = document.createElement('div');
    card.className = 'report-card';
    card.innerHTML = '<h3>' + esc(s.title) + '</h3>' +
      (s.content || []).map((c) => '<p>' + esc(c) + '</p>').join('');
    body.appendChild(card);
    if (view === 'coach') {
      const setup = ce.anchor_setup;
      if (setup && setup.needs_anchor) body.appendChild(anchorSetupCard(setup));
    }
  }

  const scCard = selfCompareCard(conclusions.self_compare);
  if (scCard) body.appendChild(scCard);

  const windEv = (ce.evidence || {}).wind_bands;
  if (byKey['wind_bands'] || conclusions.wind_gap) {
    body.appendChild(windBandsCard(byKey['wind_bands'] || { title: '风档对照', content: [] }, windEv, conclusions.wind_gap));
  }

  const proseOrder = ['data_integrity', 'sample_gate', 'auxiliary', 'notes'];
  const seen = { window_score: true, level: true, wind_bands: true };
  proseOrder.forEach((k) => {
    const s = byKey[k];
    if (!s) return;
    seen[k] = true;
    const card = document.createElement('div');
    card.className = 'report-card';
    card.innerHTML = '<h3>' + esc(s.title) + '</h3>' +
      (s.content || []).map((c) => '<p>' + esc(c) + '</p>').join('');
    body.appendChild(card);
  });
  (r.sections || []).forEach((s) => {
    if (seen[s.key]) return;
    const card = document.createElement('div');
    card.className = 'report-card';
    card.innerHTML = '<h3>' + esc(s.title) + '</h3>' +
      (s.content || []).map((c) => '<p>' + esc(c) + '</p>').join('');
    body.appendChild(card);
  });

  const advBox = $('reportAdvice');
  advBox.innerHTML = '';
  if (r.suggestions && r.suggestions.length) advBox.appendChild(adviceCard(r.suggestions));

  // 证据在建议之后、meta 之前（运动员视图不渲染）
  const prevEv = $('reportPanel').querySelector('details.evidence');
  if (prevEv) prevEv.remove();
  const evCard = coachEvidenceCard(ce);
  if (evCard) $('reportPanel').insertBefore(evCard, $('reportMeta'));

  const items = [];
  if (r.bow_type) items.push(['主弓种', r.bow_type]);
  if (view === 'coach' && ce.rolling_baseline && !evCard) {
    items.push(['滚动基线', '最近 ' + ce.rolling_baseline.n_shots + ' 箭 · 均环 ' + ce.rolling_baseline.avg_score]);
  }
  if (view === 'coach' && ce.warnings && ce.warnings.length) {
    items.push(['警告', ce.warnings.join('；')]);
  }
  const hint = (ce.anchor_rebuild_hint || r.anchor_rebuild_hint);
  if (hint && hint.reason && !evCard) items.push(['锚点提示', hint.reason]);
  if (r.generated_at_utc) items.push(['生成时间', fmtShanghai(r.generated_at_utc)]);
  if (rng) items.push(['窗口', rng]);
  $('reportMeta').innerHTML = items.map((it) =>
    '<div class="meta-line"><span class="mk">' + esc(it[0]) + '</span><span class="mv">' + esc(it[1]) + '</span></div>'
  ).join('');
}

/* ---- PR #3 AI 训练指导（流式 + 真取消）。状态：idle / reading / writing / verifying / stopping /
   final / guard / interrupted / rules / busy。只有通过服务端核对的全文才作为正文显示；
   教练视角撰写中显示灰色草稿，运动员视角服务端不发草稿（这里也不渲染）。 ---- */
let currentReport = null;   // 当前显示的报告（生成指导时绑定它的 granularity + window_key）
let gJob = null;            // 在途任务 {seq, controller, taskId, view, t0, draft, stopping}
let gSeq = 0;               // 每次作废 +1：晚到的事件一律丢弃
let gTick = null;           // 已等待计时
let gPoll = null;           // 409 后轮询 /llm/status

function gBadge(text, cls) { const b = $('gBadge'); b.textContent = text; b.className = 'g-badge' + (cls ? ' ' + cls : ''); }

function gSteps(stage) {
  const order = ['reading', 'writing', 'verifying'];
  const idx = order.indexOf(stage);
  $('gSteps').style.display = idx >= 0 ? '' : 'none';
  ['gStep1', 'gStep2', 'gStep3'].forEach((id, i) => {
    $(id).className = i < idx ? 'done' : (i === idx ? 'on' : '');
  });
}

function gStopTimers() {
  if (gTick) { clearInterval(gTick); gTick = null; }
  if (gPoll) { clearInterval(gPoll); gPoll = null; }
  $('gElapsed').textContent = '';
}

function gButtons(running, stopping) {
  $('gGenBtn').disabled = running || stopping;
  $('gCancelBtn').style.display = running || stopping ? '' : 'none';
  $('gCancelBtn').disabled = !!stopping;
  $('gCancelBtn').textContent = stopping ? '正在停止…' : '取消';
}

function gViewLabel(v) { return v === 'coach' ? '教练' : '运动员'; }

function gIdle(note) {
  gStopTimers();
  gSteps(null);
  gBadge('未生成');
  gButtons(false, false);
  $('gGenBtn').textContent = '生成AI指导';
  $('gActions').style.display = '';
  $('gRetryBtn').style.display = 'none';
  $('gRulesBtn').style.display = '';
  $('gBasis').textContent = currentReport
    ? '依据 ' + (G_NAMES[currentReport.granularity] || '') + '报告 ' + windowLabel(currentReport) + ' · 面向 ' + gViewLabel(view)
    : '';
  const skel = $('gRulesSkeleton');
  if (skel) {
    skel.innerHTML = currentReport
      ? ''
      : '<div class="basis-skel" aria-hidden="true"><div class="skel" style="width:68%"></div><div class="skel" style="width:44%"></div></div>';
  }
  $('gBody').innerHTML = rulesSkeletonHtml(currentReport) +
    (note ? '<div class="g-hint" style="margin-top:8px">' + esc(note) + '</div>' : '');
}

// 作废在途任务：先请服务端真取消，再断开连接（断开本身也是服务端的兜底取消）
function discardGuidance() {
  gSeq++;
  const job = gJob;
  gJob = null;
  gStopTimers();
  if (!job) return;
  if (job.taskId) fetch('/api/v1/llm/tasks/' + job.taskId + '/cancel', { method: 'POST' }).catch(() => {});
  try { job.controller.abort(); } catch (e) {}
}

function startGuidance() {
  if (gJob || !currentReport || !athleteId) return;  // 防连点：在途时不重复发起
  const seq = ++gSeq;
  const job = { seq, controller: new AbortController(), taskId: null, view, t0: Date.now(), draft: '', stopping: false };
  gJob = job;
  gBadge('生成中', 'run');
  gButtons(true, false);
  $('gActions').style.display = 'none';
  if ($('gRulesSkeleton')) $('gRulesSkeleton').innerHTML = '';
  $('gBasis').textContent = '依据 ' + (G_NAMES[currentReport.granularity] || '') + '报告 ' + windowLabel(currentReport) + ' · 面向 ' + gViewLabel(view);
  gStage('reading');
  gTick = setInterval(() => {
    const s = Math.floor((Date.now() - job.t0) / 1000);
    $('gElapsed').textContent = '已等待 ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }, 1000);
  const body = { granularity: currentReport.granularity, window_key: currentReport.window_key, view: job.view };
  fetch('/api/v1/athletes/' + athleteId + '/guidance/stream', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body), signal: job.controller.signal,
  }).then(async (res) => {
    if (seq !== gSeq) return;
    if (res.status === 409) { const d = await res.json().catch(() => ({})); gJob = null; gBusy(d); return; }
    if (res.status === 503) { gJob = null; gRules('AI 教练未开启，先给规则版'); return; }
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      gJob = null;
      gInterrupted('COACH-' + res.status, '这次的数据有问题，没能生成指导：' + (typeof d.detail === 'string' ? d.detail : '参数错误'));
      return;
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    let ended = false;
    while (!ended) {
      const { value, done } = await reader.read();
      if (seq !== gSeq) { reader.cancel().catch(() => {}); return; }
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const block = buf.slice(0, i);
        buf = buf.slice(i + 2);
        let ev = null, data = null;
        block.split('\n').forEach((line) => {
          if (line.startsWith('event: ')) ev = line.slice(7);
          else if (line.startsWith('data: ')) data = JSON.parse(line.slice(6));
        });
        if (!ev || seq !== gSeq) continue;   // 注释心跳（: ping）没有 event 行
        if (gEvent(ev, data || {})) ended = true;
      }
    }
    if (seq === gSeq && !ended) { gJob = null; gInterrupted('COACH-EMPTY', '指导生成中断：连接意外结束，没有收到完整结果；成绩不受影响。'); }
  }).catch(() => {
    if (seq !== gSeq) return;  // 主动作废（abort）不算错误
    gJob = null;
    gInterrupted('COACH-OFFLINE', '连不上报告引擎，指导没有生成；成绩不受影响。');
  });
}

function gStage(stage) {
  gSteps(stage);
  const job = gJob;
  if (!job || job.stopping) return;
  if (stage === 'reading') {
    $('gBody').innerHTML = '<div class="g-hint">正在读取本期报告数据，模型准备中… 规则建议已在上方报告里。</div>';
  } else if (stage === 'writing') {
    if (job.view === 'coach') {
      $('gBody').innerHTML = '<div class="g-draft"><span class="g-tag">草稿 · 待核对</span><span id="gDraft"></span><span class="g-cursor"></span></div>';
    } else {
      $('gBody').innerHTML = '<div class="g-hint">正在撰写。运动员视角：完整指导通过数据核对后一次性显示。</div>';
    }
  } else if (stage === 'verifying') {
    const tag = document.querySelector('#gBody .g-tag');
    if (tag) tag.textContent = '草稿 · 正在核对数据…';
    const cur = document.querySelector('#gBody .g-cursor');
    if (cur) cur.remove();
    if (job.view !== 'coach') $('gBody').innerHTML = '<div class="g-hint">正在核对数据…</div>';
  }
}

// 返回 true = 终止事件
function gEvent(ev, d) {
  if (ev === 'accepted') { if (gJob) gJob.taskId = d.task_id; return false; }
  if (ev === 'stage') { gStage(d.stage); return false; }
  if (ev === 'delta') {
    if (!gJob || gJob.view !== 'coach' || gJob.stopping) return false;
    gJob.draft += d.text || '';
    const el = $('gDraft');
    if (el) el.textContent = gJob.draft;
    return false;
  }
  gJob = null;
  gStopTimers();
  if (ev === 'final') gFinal(d);
  else if (ev === 'guardrail_failed') gGuard(d);
  else if (ev === 'cancelled') gIdle('已取消，后台已停止，可以重新生成。');
  else if (ev === 'error') {
    if (d.code === 'COACH-OFFLINE') gRules('AI 教练离线，先给规则版');
    else gInterrupted(d.code || 'COACH-LLM', d.message || '指导生成中断；成绩不受影响。');
  }
  return true;
}

function gFinal(d) {
  gSteps(null);
  gBadge('✓ 已生成', 'ok');
  gButtons(false, false);
  $('gGenBtn').textContent = '重新生成';
  $('gActions').style.display = 'none';
  if ($('gRulesSkeleton')) $('gRulesSkeleton').innerHTML = '';
  const t = (d.generated_at || '').slice(11, 19);
  $('gBasis').textContent = 'AI 教练 + 规则引擎 · 生成于 ' + t + ' · 依据 ' + (G_NAMES[d.granularity] || '') + '报告 ' +
    windowLabel(d) + ' · 面向 ' + gViewLabel(d.view) + ' · ✓ 已通过数据核对';
  const div = document.createElement('div');
  div.textContent = d.text || '';   // 用最终全文整体替换草稿（不是把草稿转色）
  $('gBody').innerHTML = '';
  $('gBody').appendChild(div);
}

function gFailCommon(badgeText, basis) {
  gSteps(null);
  gBadge(badgeText, 'err');
  gButtons(false, false);
  $('gGenBtn').textContent = '生成AI指导';
  $('gActions').style.display = '';
  $('gRetryBtn').style.display = '';
  $('gRulesBtn').style.display = '';
  if ($('gRulesSkeleton')) $('gRulesSkeleton').innerHTML = '';
  $('gBasis').textContent = basis;
}

function gGuard(d) {
  gFailCommon('已中断', new Date().toTimeString().slice(0, 8) + ' · 数值与数据不符 · COACH-GUARD');
  const html = ['<div class="g-alert err">AI 给出的内容与本期数据对不上，<b>没有显示</b>，以免误导。<br>' + esc(d.message || '') + '</div>'];
  if (d.reason) html.push('<div class="g-code">核对结果：' + esc(d.reason) + '</div>');
  if (d.fallback_skeleton) html.push('<details class="sources"><summary>报告原文</summary><div class="g-hint" style="white-space:pre-wrap;margin-top:6px">' + esc(d.fallback_skeleton) + '</div></details>');
  $('gBody').innerHTML = html.join('');
}

function gInterrupted(code, message) {
  gFailCommon('已中断', new Date().toTimeString().slice(0, 8) + ' · ' + code);
  $('gBody').innerHTML = '<div class="g-alert err"><b>指导生成中断</b><br>' + esc(message) + '</div><div class="g-code">错误码 ' + esc(code) + '</div>';
}

function gRules(note) {
  gStopTimers();
  gSteps(null);
  gBadge('规则版', 'warn');
  gButtons(false, false);
  $('gGenBtn').textContent = '重新生成';
  $('gActions').style.display = 'none';
  if ($('gRulesSkeleton')) $('gRulesSkeleton').innerHTML = '';
  $('gBasis').textContent = '规则引擎 · ' + (currentReport ? (G_NAMES[currentReport.granularity] || '') + '报告 ' + windowLabel(currentReport) : '');
  $('gBody').innerHTML = (note ? '<div class="g-alert warn">' + esc(note) + '</div>' : '') +
    rulesSkeletonHtml(currentReport);
}

function gBusy(d) {
  gStopTimers();
  gSteps(null);
  gBadge('未生成');
  $('gActions').style.display = 'none';
  $('gCancelBtn').style.display = 'none';
  $('gGenBtn').disabled = true;
  $('gBody').innerHTML = '<div class="g-alert warn">引擎正在' + (d.state === 'cancelling' ? '停止上一个任务' : '生成另一份内容') +
    '，空闲后才能生成（最长约 ' + esc(d.retry_after_sec || '') + ' 秒）。</div>';
  const seq = gSeq;
  gPoll = setInterval(() => {
    api('/api/v1/llm/status').then((st) => {
      if (seq !== gSeq) return;
      if (!st.busy) gIdle('引擎已空闲，可以生成。');
    }).catch(() => {});
  }, 2000);
}

function cancelGuidance() {
  const job = gJob;
  if (!job || job.stopping) return;
  job.stopping = true;
  gButtons(true, true);
  gBadge('正在停止', 'run');
  $('gBody').innerHTML = '<div class="g-hint">正在停止后台任务…（模型停下后才能重新生成）</div>';
  if (job.taskId) {
    // 真取消：原流会在模型停止后发 cancelled 事件
    fetch('/api/v1/llm/tasks/' + job.taskId + '/cancel', { method: 'POST' }).catch(() => {});
  } else {
    // 还没拿到 task_id：断开连接（服务端兜底取消），再轮询到空闲
    gSeq++;
    gJob = null;
    try { job.controller.abort(); } catch (e) {}
    gBusy({ state: 'cancelling', retry_after_sec: 5 });
  }
}

$('gGenBtn').onclick = startGuidance;
$('gRetryBtn').onclick = startGuidance;
$('gCancelBtn').onclick = cancelGuidance;
$('gRulesBtn').onclick = () => gRules('');

function deleteNote(id) {
  api('/api/v1/athletes/' + athleteId + '/notes/' + id, { method: 'DELETE' })
    .then(() => refreshSidePanels())
    .catch((e) => alert('删除失败：' + e.message));
}

document.querySelectorAll('#viewSwitch button').forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll('#viewSwitch button').forEach((x) => x.classList.remove('active'));
    b.classList.add('active');
    view = b.dataset.view;
    // 指导绑定视角：先作废（尤其不能让教练视角的草稿留在运动员视角下），报告重取后回到未生成
    discardGuidance();
    if (currentReport) gIdle();
    refreshSidePanels();
    // 报告正文按视角过滤备注（教练观察仅教练可见），换视角必须重取同一窗口，
    // 否则运动员视图会继续显示教练视角那份正文
    if (lastRequest) generate(lastRequest);
  };
});

$('athleteSelect').onchange = onAthleteChange;
$('addNoteBtn').onclick = () => {
  const content = $('noteContent').value.trim();
  if (!content || !athleteId) return;
  const authorRole = view === 'coach' ? 'coach' : 'athlete';
  api('/api/v1/athletes/' + athleteId + '/notes', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      note_type: $('noteType').value, content: content,
      author_role: authorRole, actor_id: athleteId,
    }),
  }).then(() => { $('noteContent').value = ''; refreshSidePanels(); })
    .catch((e) => alert('添加失败：' + e.message));
};

loadAthletes();
</script>
