<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>射箭 AI 训练报告引擎</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --header-bg: rgba(255,255,255,0.85);
    --text: #1d1d1f;
    --text-2: #6e6e73;
    --accent: #0068d6;
    --accent-solid: #0068d6;
    --accent-solid-hover: #0071e3;
    --accent-soft: rgba(0,113,227,.06);
    --accent-line: rgba(0,113,227,.16);
    --accent-ring: rgba(0,113,227,.22);
    --border: #e5e5ea;
    --fill-1: #e8e8ed;
    --fill-2: #c7c7cc;
    --disabled-bg: #8e8e93;
    --seg-thumb: #ffffff;
    --bubble: #f0f0f2;
    --card-soft: #fbfbfd;
    --danger: #ff3b30;
    --warn: #b2501a;
    --radius: 14px;
    --radius-sm: 8px;
    --radius-xs: 6px;
    --shadow-1: 0 1px 2px rgba(0,0,0,.04);
    --shadow-2: 0 8px 24px rgba(0,0,0,.08);
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  }
  /* ---- 暗色模式：仅覆盖 token，组件规则不动 ---- */
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #000000;
      --card: #1c1c1e;
      --header-bg: rgba(28,28,30,0.8);
      --text: #f5f5f7;
      --text-2: #98989d;
      --accent: #409cff;
      --accent-solid: #0a6ad0;
      --accent-solid-hover: #0a6fd6;
      --accent-soft: rgba(10,132,255,.14);
      --accent-line: rgba(10,132,255,.30);
      --accent-ring: rgba(10,132,255,.40);
      --border: #38383a;
      --fill-1: #2c2c2e;
      --fill-2: #48484a;
      --disabled-bg: #48484a;
      --seg-thumb: #636366;
      --bubble: #2c2c2e;
      --card-soft: #232325;
      --danger: #ff453a;
      --warn: #ff9f0a;
      --shadow-1: 0 1px 2px rgba(0,0,0,.5);
      --shadow-2: 0 8px 24px rgba(0,0,0,.6);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--header-bg);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; margin-right: auto; }

  /* ---- 分段控件（视角切换 / 报告粒度）：滑动指示块 ---- */
  .segmented {
    --seg-count: 2; --seg-item-w: 88px;
    position: relative; display: inline-flex; background: var(--fill-1);
    border-radius: var(--radius-sm); padding: 2px;
  }
  .seg-thumb {
    position: absolute; top: 2px; left: 2px;
    width: calc((100% - 4px) / var(--seg-count)); height: calc(100% - 4px);
    background: var(--seg-thumb); border-radius: 7px; box-shadow: var(--shadow-1);
    transition: transform 180ms var(--ease-out);
  }
  .segmented button {
    position: relative; z-index: 1; width: var(--seg-item-w);
    border: none; background: transparent; padding: 6px 0;
    font-size: 13px; color: var(--text-2); border-radius: 7px; cursor: pointer;
    font-family: inherit;
    transition: color 160ms ease, transform 160ms var(--ease-out);
  }
  .segmented button.active { color: var(--text); font-weight: 600; }
  .segmented button:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-ring); }
  #granSwitch { --seg-count: 5; --seg-item-w: 64px; }

  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 60px; }
  .panel {
    background: var(--card); border-radius: var(--radius);
    padding: 18px 20px; margin-bottom: 16px;
    box-shadow: var(--shadow-1);
  }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  select, input, textarea {
    font-family: inherit; font-size: 14px; color: var(--text);
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 7px 10px; outline: none;
    transition: border-color 160ms ease, box-shadow 160ms ease;
  }
  select:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring);
  }
  .label { font-size: 12px; color: var(--text-2); margin-right: -2px; }
  button.primary {
    font-family: inherit; font-size: 14px; font-weight: 500; color: #fff;
    background: var(--accent-solid); border: none; border-radius: var(--radius-sm);
    padding: 8px 18px; cursor: pointer;
    transition: transform 160ms var(--ease-out), background 160ms ease;
  }
  button.primary:disabled { background: var(--disabled-bg); cursor: default; }
  button.ghost {
    font-family: inherit; font-size: 13px; color: var(--text);
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 6px 12px; cursor: pointer;
    transition: transform 160ms var(--ease-out), color 120ms ease, border-color 120ms ease;
  }
  button.primary:focus-visible, button.ghost:focus-visible {
    outline: none; box-shadow: 0 0 0 3px var(--accent-ring);
  }
  .granularity-bar { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }

  /* ---- 状态 chip：靠近触发点，生成中呼吸 ---- */
  #status {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text-2);
    padding: 4px 11px; border-radius: 999px; background: var(--fill-1);
    opacity: 0; transition: opacity 160ms ease;
  }
  #status.show { opacity: 1; }
  #status::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--fill-2);
  }
  #status.busy::before { background: var(--accent); animation: pulse 900ms ease-in-out infinite; }

  .section-title { font-size: 13px; font-weight: 600; color: var(--text-2); letter-spacing: .02em; margin-bottom: 10px; }

  /* ---- 报告区：数字主角 → 建议 → 支撑 ---- */
  .report-head {
    display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap;
    font-size: 14px; color: var(--text-2); margin-bottom: 14px;
  }
  .report-head .rh-name { font-size: 15px; font-weight: 600; color: var(--text); }
  .report-head .rh-sep { color: var(--fill-2); margin: 0 3px; }
  .hero { margin-bottom: 4px; }
  .metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px 12px; }
  @media (max-width: 720px) { .metric-grid { grid-template-columns: repeat(2, 1fr); } }
  .metric { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .metric .v {
    font-size: 22px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15;
    font-variant-numeric: tabular-nums;
  }
  .metric .v .u { font-size: 12px; font-weight: 500; color: var(--text-2); margin-left: 1px; }
  .metric .l { font-size: 12px; color: var(--text-2); }
  .hero-foot { margin-top: 12px; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .hero-empty { padding: 20px 0 6px; font-size: 14px; color: var(--text-2); }

  .advice {
    margin: 16px 0 4px; padding: 14px 16px; border-radius: 12px;
    background: var(--accent-soft); border: 1px solid var(--accent-line);
  }
  .advice h3 { font-size: 13px; font-weight: 600; color: var(--accent); letter-spacing: .01em; margin-bottom: 8px; }
  .advice ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .advice li { position: relative; padding-left: 14px; font-size: 14px; line-height: 1.6; }
  .advice li::before {
    content: ''; position: absolute; left: 2px; top: .6em;
    width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
  }

  .sec { padding: 16px 0; border-top: 1px solid var(--border); }
  .sec:first-child { border-top: none; padding-top: 4px; }
  .sec h3 { font-size: 13px; font-weight: 600; color: var(--text); letter-spacing: -0.01em; margin-bottom: 8px; }
  .sec p { font-size: 14px; line-height: 1.65; color: var(--text); }
  .sec p + p { margin-top: 6px; }
  .sec p.notice {
    color: var(--text-2); font-size: 13px; line-height: 1.6;
    background: var(--card-soft); border: 1px solid var(--border);
    border-radius: var(--radius-xs); padding: 8px 10px;
  }
  /* 风档对照：对齐小表（不写成三行句子） */
  .sec .wb-table {
    width: 100%; border-collapse: collapse; font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  .sec .wb-table th, .sec .wb-table td {
    text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border);
  }
  .sec .wb-table th { font-size: 12px; font-weight: 600; color: var(--text-2); letter-spacing: .02em; }
  .sec .wb-table th.num, .sec .wb-table td.num { text-align: right; }
  .sec .wb-table td.num { color: var(--text); font-weight: 500; }
  .sec .wb-table tbody tr:last-child td { border-bottom: none; }

  /* ---- 建立锚点引导（教练视图；无锚点时紧接水平对比段）---- */
  .anchor-setup {
    margin-top: 12px; padding: 14px 16px; border-radius: 12px;
    background: var(--card-soft); border: 1px solid var(--border);
  }
  .anchor-setup h3 { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .anchor-setup p { font-size: 13px; line-height: 1.6; color: var(--text-2); }
  .anchor-setup .as-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .anchor-setup select { flex: 1; min-width: 170px; }

  .meta {
    margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--text-2);
    display: flex; flex-direction: column; gap: 4px;
  }
  .meta:empty { display: none; }
  .meta-line { display: flex; gap: 10px; }
  .meta-line .mk { min-width: 60px; color: var(--text-2); }
  .meta-line .mv { color: var(--text); }

  .empty { text-align: center; color: var(--text-2); font-size: 14px; padding: 32px 0; }
  /* 报告区空态：高度收紧 + 一句主文案 + 一个引导动作 */
  .empty-state {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 28px 16px; text-align: center;
  }
  .empty-state .es-title { font-size: 14px; color: var(--text-2); }
  /* 侧栏空态：左对齐、小圆点 + 一句灰字，高度贴合内容 */
  .empty-inline {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 2px; font-size: 13px; color: var(--text-2);
  }
  .empty-inline::before {
    content: ''; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--fill-2);
  }

  .note { border-top: 1px solid var(--border); padding: 10px 0; display: flex; gap: 12px; align-items: baseline; }
  .note:first-child { border-top: none; }
  .note .type { font-size: 12px; color: var(--accent); font-weight: 600; min-width: 64px; }
  .note .content { font-size: 14px; line-height: 1.5; flex: 1; }
  .note .who { font-size: 12px; color: var(--text-2); min-width: 40px; text-align: right; }
  .note .del {
    font-size: 12px; color: var(--text-2); background: none; border: none;
    cursor: pointer; font-family: inherit; transition: color 120ms ease;
  }
  .memory { font-size: 13px; line-height: 1.6; padding: 8px 0; border-top: 1px solid var(--border); }
  .memory:first-child { border-top: none; }
  .memory .k { color: var(--text-2); }
  .add-note { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .add-note select, .add-note input { flex: 1; min-width: 120px; }
  .add-note input.content-input { flex: 3; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 720px) { .two-col { grid-template-columns: 1fr; } }

  /* ---- 对话窗：消息 / 等待态三点 / 折叠溯源 / 建议卡片 ---- */
  .chat-box { display: flex; flex-direction: column; gap: 10px; max-height: 420px; overflow-y: auto; padding: 4px 2px; }
  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .msg.assistant { justify-content: flex-start; }
  .bubble { max-width: 78%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.6; }
  .msg.user .bubble { background: var(--accent-solid); color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--bubble); color: var(--text); border-bottom-left-radius: 4px; }
  .bubble .degraded { font-size: 12px; color: var(--warn); margin-top: 6px; }
  .bubble.thinking { display: inline-flex; align-items: center; gap: 4px; padding: 13px 14px; }
  .bubble.thinking span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--text-2);
    animation: pulse 900ms ease-in-out infinite;
  }
  .bubble.thinking span:nth-child(2) { animation-delay: 150ms; }
  .bubble.thinking span:nth-child(3) { animation-delay: 300ms; }
  .chat-foot { display: flex; gap: 8px; margin-top: 12px; }
  .chat-foot input { flex: 1; }
  details.sources { margin-top: 8px; font-size: 12px; }
  details.sources summary { color: var(--text-2); cursor: pointer; user-select: none; }
  details.sources > ul {
    margin: 6px 0 0; padding-left: 18px; color: var(--text-2); line-height: 1.7;
    transform-origin: top left;
  }
  details.sources[open] > ul { animation: popIn 150ms var(--ease-out) both; }
  details.sources .src-type { color: var(--accent); font-weight: 600; }
  .note-card {
    margin-top: 8px; border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 12px; font-size: 12px; background: var(--card-soft);
  }
  .note-card .nc-head {
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    color: var(--text-2); margin-bottom: 4px;
  }
  .note-card .nc-content { font-size: 13px; line-height: 1.5; }
  .note-card .nc-badge { color: var(--accent); font-size: 11px; white-space: nowrap; }

  /* ---- 动效：全部 ≤300ms，只动 transform / opacity ---- */
  @keyframes riseIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes popIn { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .enter { animation: riseIn 200ms var(--ease-out) both; }

  @media (hover: hover) and (pointer: fine) {
    button.primary:hover:not(:disabled) { background: var(--accent-solid-hover); }
    button.ghost:hover { border-color: var(--accent); color: var(--accent); }
    .segmented button:hover:not(.active) { color: var(--text); }
    .note .del:hover { color: var(--danger); }
  }
  button.primary:active:not(:disabled),
  button.ghost:active,
  .segmented button:active { transform: scale(.97); }

  @media (prefers-reduced-motion: reduce) {
    .enter { animation-name: fadeIn; }
    details.sources[open] > ul { animation-name: fadeIn; }
    .seg-thumb { transition: none; }
    button.primary:active:not(:disabled),
    button.ghost:active,
    .segmented button:active { transform: none; }
  }
</style>
</head>
<body>
<header>
  <h1>射箭 AI 训练报告引擎</h1>
  <div class="segmented" id="viewSwitch">
    <span class="seg-thumb"></span>
    <button data-view="coach" class="active">教练视图</button>
    <button data-view="athlete">运动员视图</button>
  </div>
</header>

<main>
  <div class="panel">
    <div class="row">
      <span class="label">运动员</span>
      <select id="athleteSelect" style="min-width:180px"><option value="">加载中…</option></select>
      <span class="label" id="profileInfo"></span>
    </div>
    <div class="row" style="margin-top:12px" id="windowRow">
      <span class="label">场次</span>
      <select id="sessionSelect" style="min-width:200px"></select>
    </div>
    <div class="granularity-bar">
      <div class="segmented" id="granSwitch">
        <span class="seg-thumb"></span>
        <button data-g="daily">日报告</button>
        <button data-g="weekly" class="active">周报告</button>
        <button data-g="monthly">月报告</button>
        <button data-g="quarterly">季报告</button>
        <button data-g="yearly">年报告</button>
      </div>
      <input id="windowInput" style="width:130px" placeholder="窗口（默认当前）">
      <span class="label" id="windowHint"></span>
      <span id="status"></span>
    </div>
  </div>

  <div id="reportPanel" class="panel" style="display:none">
    <div class="report-head" id="reportHead"></div>
    <div id="reportHero"></div>
    <div id="reportAdvice"></div>
    <div id="reportBody"></div>
    <div class="meta" id="reportMeta"></div>
  </div>
  <div id="reportEmpty" class="empty-state">
    <div class="es-title">尚未生成报告</div>
    <button class="primary" id="emptyGenBtn" disabled>生成周报告</button>
  </div>

  <div class="two-col">
    <div class="panel">
      <div class="section-title">备注</div>
      <div id="notesList"><div class="empty-inline">暂无备注</div></div>
      <div class="add-note">
        <select id="noteType">
          <option value="injury">伤病</option>
          <option value="goal">训练目标</option>
          <option value="coach_obs">教练观察</option>
        </select>
        <input id="noteContent" class="content-input" placeholder="录入内容…">
        <button class="primary" id="addNoteBtn">添加</button>
      </div>
    </div>
    <div class="panel">
      <div class="section-title">历史结论沉淀</div>
      <div id="memoriesList"><div class="empty-inline">暂无结论沉淀</div></div>
    </div>
  </div>

  <div class="panel" id="chatPanel">
    <div class="section-title">对话问询</div>
    <div class="row" style="margin-bottom:10px">
      <span class="label">引用报告</span>
      <select id="chatReportSelect" style="min-width:220px"><option value="">加载中…</option></select>
    </div>
    <div class="chat-box" id="chatMessages">
      <div class="empty" style="padding:20px 0">选择运动员后，可就训练表现提问（需先生成一份报告）</div>
    </div>
    <div class="chat-foot">
      <input id="chatInput" placeholder="例如：这周为什么进步了？" maxlength="200">
      <button class="primary" id="chatSendBtn">发送</button>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let view = 'coach';
let athletes = [];
let athleteId = null;
let sessions = [];
let lastRequest = null; // 最近一次生成的粒度：切换视角时按新视角重取同一窗口

function api(path, opts) {
  return fetch(path, opts).then(async (res) => {
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || ('HTTP ' + res.status));
    return data;
  });
}

function setStatus(text, busy) {
  const el = $('status');
  el.textContent = text || '';
  el.classList.toggle('show', !!text);
  el.classList.toggle('busy', !!busy);
}

function isoWeek(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (date.getUTCDay() + 6) % 7;
  date.setUTCDate(date.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(date.getUTCFullYear(), 0, 4));
  const firstDayNum = (firstThursday.getUTCDay() + 6) % 7;
  firstThursday.setUTCDate(firstThursday.getUTCDate() - firstDayNum + 3);
  const week = 1 + Math.round((date - firstThursday) / (7 * 24 * 3600 * 1000));
  return date.getUTCFullYear() + '-W' + String(week).padStart(2, '0');
}

function currentWindow() {
  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth() + 1;
  const q = Math.floor((m - 1) / 3) + 1;
  return {
    week: isoWeek(now),
    month: y + '-' + String(m).padStart(2, '0'),
    quarter: y + 'Q' + q,
    year: String(y),
  };
}

function setReportEmpty(title, canGenerate) {
  const t = $('reportEmpty').querySelector('.es-title');
  if (t) t.textContent = title;
  $('emptyGenBtn').disabled = !canGenerate;
}

function loadAthletes() {
  api('/api/v1/athletes').then((r) => {
    athletes = r.athletes || [];
    const sel = $('athleteSelect');
    sel.innerHTML = '';
    if (!athletes.length) {
      sel.innerHTML = '<option value="">（无运动员，请先导入数据）</option>';
      setReportEmpty('暂无运动员数据，请先导入', false);
      return;
    }
    athletes.forEach((a) => {
      const opt = document.createElement('option');
      opt.value = a.athlete_id;
      opt.textContent = a.name + (a.bow_type ? ' · ' + a.bow_type : '');
      sel.appendChild(opt);
    });
    // 默认选中「最近有训练」的运动员：列表按姓名排序，取第一个可能落到久未训练的档案，
    // 打开即「样本不足」。last_session_utc 为空的排到最后。
    const pick = athletes.slice().sort((a, b) =>
      (b.last_session_utc || '').localeCompare(a.last_session_utc || '')
    )[0];
    sel.value = pick.athlete_id;
    onAthleteChange();
  }).catch((e) => { setStatus('加载失败：' + e.message); });
}

function onAthleteChange() {
  athleteId = $('athleteSelect').value;
  if (!athleteId) return;
  setStatus('加载中…', true);
  $('reportEmpty').style.display = '';
  setReportEmpty('尚未生成报告', true);
  $('reportPanel').style.display = 'none';
  lastRequest = null; // 换了运动员就丢弃上一份报告的窗口，避免切视角时误触发重取
  api('/api/v1/athletes/' + athleteId).then((r) => {
    const p = r.profile || {};
    const bits = [];
    if (p.level) bits.push(p.level);
    if (p.bow_type) bits.push(p.bow_type);
    if (p.age) bits.push(p.age + '岁');
    $('profileInfo').textContent = bits.join(' · ');
    setStatus('');
  }).catch(() => { setStatus(''); });

  api('/api/v1/athletes/' + athleteId + '/sessions').then((r) => {
    sessions = r.sessions || [];
    const sel = $('sessionSelect');
    sel.innerHTML = '';
    if (!sessions.length) {
      sel.innerHTML = '<option value="">（无场次）</option>';
      return;
    }
    sessions.slice().reverse().forEach((s) => {
      const opt = document.createElement('option');
      opt.value = s.session_id;
      const t = (s.session_time_utc || '').slice(0, 10);
      opt.textContent = s.session_id + ' · ' + t + ' · ' + (s.shot_count || 0) + '箭';
      sel.appendChild(opt);
    });
    sel.value = sessions[sessions.length - 1].session_id;
  });

  resetChat();
  refreshSidePanels();
  loadChatReports();
}

function resetChat() {
  // 换运动员必须清空问答：否则上一位运动员的对话留在屏幕上，容易被误读成本人的数据
  $('chatMessages').innerHTML =
    '<div class="empty" style="padding:20px 0">选择运动员后，可就训练表现提问（需先生成一份报告）</div>';
}

function refreshSidePanels() {
  if (!athleteId) return;
  api('/api/v1/athletes/' + athleteId + '/notes?view=' + view).then((r) => {
    const box = $('notesList');
    const notes = r.notes || [];
    if (!notes.length) { box.innerHTML = '<div class="empty-inline">暂无备注</div>'; return; }
    box.innerHTML = notes.map((n) =>
      '<div class="note"><span class="type">' + typeLabel(n.note_type) + '</span>' +
      '<span class="content">' + esc(n.content) + '</span>' +
      '<span class="who">' + esc(n.author_role || '') + '</span>' +
      '<button class="del" data-id="' + n.note_id + '">删除</button></div>'
    ).join('');
    box.querySelectorAll('.del').forEach((b) => b.onclick = () => deleteNote(b.dataset.id));
  }).catch(() => { $('notesList').innerHTML = '<div class="empty-inline">加载失败</div>'; });

  api('/api/v1/athletes/' + athleteId + '/memories').then((r) => {
    const box = $('memoriesList');
    const ms = r.memories || [];
    if (!ms.length) { box.innerHTML = '<div class="empty-inline">暂无结论沉淀</div>'; return; }
    box.innerHTML = ms.slice(0, 8).map((m) =>
      '<div class="memory"><span class="k">' + (G_NAMES[m.granularity] || m.granularity) +
      (m.window_key ? ' · ' + esc(windowLabel(m)) : '') + '</span>：' +
      esc(m.conclusion || m.summary || '') + '</div>'
    ).join('');
  }).catch(() => {});
}

function typeLabel(t) {
  return { injury: '伤病', goal: '目标', coach_obs: '教练观察' }[t] || t;
}

/* ---- 对话窗：引用已生成报告 → ask → 回答 + 折叠溯源 + 建议记录卡片 ---- */
const G_NAMES = { daily: '日', weekly: '周', monthly: '月', quarterly: '季', yearly: '年' };
let chatReports = [];

function windowLabel(x) {
  const k = String(x.window_key || '');
  return x.granularity === 'daily' ? k.replace(/^daily:/, '') : k;
}

function loadChatReports(preferKey) {
  if (!athleteId) return;
  const sel = $('chatReportSelect');
  const prev = chatReports[parseInt(sel.value, 10)];
  const keepKey = preferKey || (prev ? prev.granularity + '|' + prev.window_key : '');
  sel.innerHTML = '<option value="">加载中…</option>';
  api('/api/v1/athletes/' + athleteId + '/reports').then((r) => {
    // 同一窗口只保留最新一份：重生成会留下多行缓存，否则下拉被重复项撑爆（实测周报重复 37 条）。
    // 接口按 generated_at_utc DESC 返回，故每个窗口首次出现即为最新。
    const seen = {};
    chatReports = (r.reports || []).filter((x) => {
      const k = x.granularity + '|' + x.window_key;
      if (seen[k]) return false;
      seen[k] = true;
      return true;
    });
    if (!chatReports.length) {
      sel.innerHTML = '<option value="">（请先生成一份报告）</option>';
      $('chatSendBtn').disabled = true;
      return;
    }
    sel.innerHTML = chatReports.map((x, i) =>
      '<option value="' + i + '">' + (G_NAMES[x.granularity] || x.granularity) + ' · ' +
      esc(windowLabel(x)) + ' · ' + esc((x.generated_at_utc || '').slice(0, 10)) + '</option>'
    ).join('');
    // 优先选中刚生成的那份；否则沿用原选中项；再否则取最新一份
    let idx = -1;
    if (keepKey) chatReports.forEach((x, i) => {
      if (idx < 0 && x.granularity + '|' + x.window_key === keepKey) idx = i;
    });
    sel.value = String(idx >= 0 ? idx : 0);
    $('chatSendBtn').disabled = false;
  }).catch(() => {
    sel.innerHTML = '<option value="">（加载失败）</option>';
    $('chatSendBtn').disabled = true;
  });
}

function sendChat() {
  const q = $('chatInput').value.trim();
  if (!q || !athleteId || $('chatSendBtn').disabled) return;
  $('chatInput').value = '';
  addMsg('user', q);
  const pending = addThinking();
  const body = { question: q, view: view };
  const rep = chatReports[parseInt($('chatReportSelect').value, 10)];
  if (rep) { body.granularity = rep.granularity; body.window_key = rep.window_key; }
  api('/api/v1/athletes/' + athleteId + '/ask', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  }).then((resp) => {
    pending.innerHTML = renderAnswer(resp);
    pending.classList.remove('thinking');
    scrollChat();
  }).catch((e) => {
    pending.classList.remove('thinking');
    pending.innerHTML = '<span class="degraded">问询失败：' + esc(e.message) + '</span>';
  });
}

function addMsg(role, text) {
  const box = $('chatMessages');
  const empty = box.querySelector('.empty');
  if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  div.appendChild(bubble);
  box.appendChild(div);
  scrollChat();
  return bubble;
}

function addThinking() {
  const box = $('chatMessages');
  const empty = box.querySelector('.empty');
  if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = 'msg assistant';
  const bubble = document.createElement('div');
  bubble.className = 'bubble thinking';
  bubble.innerHTML = '<span></span><span></span><span></span>';
  div.appendChild(bubble);
  box.appendChild(div);
  scrollChat();
  return bubble;
}

function renderAnswer(resp) {
  // 调用方（addThinking/addMsg）返回的就是 .bubble 容器，这里只填内容，
  // 否则会渲染成 bubble 套 bubble，答案被套上两层内边距
  const html = [];
  html.push(esc(resp.answer || ''));
  if (resp.degraded) {
    const reason = resp.reason || '';
    html.push('<div class="degraded">降级：' + esc(reason) + '</div>');
  }
  const srcs = resp.sources || [];
  if (srcs.length) {
    html.push('<details class="sources"><summary>溯源（' + srcs.length + '）</summary><ul>');
    srcs.forEach((s) => {
      html.push('<li><span class="src-type">' + esc(s.type || '') + '</span> · ' +
        esc(s.title || '') + '<br>' + esc((s.summary || '').slice(0, 120)) + '</li>');
    });
    html.push('</ul></details>');
  }
  const sn = resp.suggested_note;
  if (sn) {
    html.push('<div class="note-card"><div class="nc-head"><span>' + esc(typeLabel(sn.note_type)) +
      ' · 来源 ' + esc(sn.source || '') + '</span><span class="nc-badge">只读建议</span></div>' +
      '<div class="nc-content">' + esc(sn.content) + '</div></div>');
  }
  return html.join('');
}

function scrollChat() {
  const box = $('chatMessages');
  box.scrollTop = box.scrollHeight;
}

$('chatSendBtn').onclick = sendChat;
$('chatInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChat(); });

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function windowParams(g) {
  const manual = $('windowInput').value.trim();
  if (g === 'daily') return { session_id: $('sessionSelect').value || '' };
  if (manual) {
    const hints = { weekly: '2026-W34', monthly: '2026-08', quarterly: '2026Q3', yearly: '2026' };
    $('windowHint').textContent = '格式：' + hints[g];
    return { [g === 'weekly' ? 'week' : g === 'monthly' ? 'month' : g === 'quarterly' ? 'quarter' : 'year']: manual };
  }
  const w = currentWindow();
  $('windowHint').textContent = '';
  if (g === 'weekly') return { week: w.week };
  if (g === 'monthly') return { month: w.month };
  if (g === 'quarterly') return { quarter: w.quarter };
  return { year: w.year };
}

function generate(g) {
  if (!athleteId) return;
  const p = windowParams(g);
  const qs = new URLSearchParams({ view: view, refresh: '1', ...p }).toString();
  $('granSwitch').querySelectorAll('button').forEach((b) => b.classList.toggle('active', b.dataset.g === g));
  moveThumb($('granSwitch'));
  setStatus('生成中…', true);
  api('/api/v1/athletes/' + athleteId + '/reports/' + g + '?' + qs, { method: 'POST' })
    .then((r) => {
      lastRequest = g;
      renderReport(r);
      // 生成后立刻刷新「引用报告」下拉并选中这份：否则新报告不在列表里，
      // 此前没有任何报告时对话输入框会一直处于禁用状态。
      loadChatReports(r.granularity ? r.granularity + '|' + r.window_key : '');
      setStatus(r.cached ? '已读取缓存' : '已生成');
    })
    .catch((e) => { setStatus(''); alert('生成失败：' + e.message); });
}

$('granSwitch').querySelectorAll('button').forEach((b) => {
  b.onclick = () => { $('windowHint').textContent = ''; generate(b.dataset.g); };
});
$('emptyGenBtn').onclick = () => generate('weekly');

/* ---- 报告渲染：数字主角 → 建议 → 支撑（层级重排，核心数字脱离句子）---- */

// 缺失 / 存疑类提示：独立样式，不与正文同权
const NOTICE_RE = /无风速数据|无心率数据|空窗口|不可用|未计入|数据存疑|暂无可|暂无|样本不足|无锚点|降级期/;

// 从「含脱靶均环 4.23，有效箭均环 7.89，脱靶率 46.4%…（n=233）」这类固定文案里
// 提取「标签 / 数值 / 单位」三元组；识别失败返回 null → 退回整段正文（不冒险渲染）。
function parseMetrics(line) {
  const nMatch = line.match(/[（(]\s*n\s*=\s*(\d+)\s*[）)]/);
  const body = line.replace(/[（(]\s*n\s*=\s*\d+\s*[）)]/, '').trim();
  const parts = body.split(/[，,]/).map((s) => s.trim()).filter(Boolean);
  if (parts.length < 2) return null;
  const items = [];
  for (const p of parts) {
    const mm = p.match(/^(.+?)\s*([\d.]+)\s*(%?)$/);
    if (!mm) return null;
    items.push({ label: mm[1].trim(), value: mm[2], unit: mm[3] || '' });
  }
  return { items, n: nMatch ? nMatch[1] : null };
}

function metricGrid(parsed) {
  const card = document.createElement('div');
  card.className = 'hero enter';
  const grid = document.createElement('div');
  grid.className = 'metric-grid';
  parsed.items.forEach((it) => {
    const el = document.createElement('div');
    el.className = 'metric';
    el.innerHTML = '<div class="v">' + esc(it.value) +
      (it.unit ? '<span class="u">' + esc(it.unit) + '</span>' : '') + '</div>' +
      '<div class="l">' + esc(it.label) + '</div>';
    grid.appendChild(el);
  });
  card.appendChild(grid);
  if (parsed.n) {
    const foot = document.createElement('div');
    foot.className = 'hero-foot';
    foot.textContent = '样本 ' + parsed.n + ' 箭';
    card.appendChild(foot);
  }
  return card;
}

function sectionCard(s) {
  const card = document.createElement('div');
  card.className = 'sec enter';
  const h = document.createElement('h3');
  h.textContent = s.title;
  card.appendChild(h);
  (s.content || []).forEach((c) => {
    const p = document.createElement('p');
    p.textContent = c;
    if (NOTICE_RE.test(c)) p.className = 'notice';
    card.appendChild(p);
  });
  return card;
}

/* 风档对照：把「…档：均环 X（n=Y）」解析成对齐小表；非该格式的行按普通/缺失样式呈现 */
const WB_RE = /^(.*?档)\s*[：:]\s*均环\s*([\d.]+)\s*[（(]\s*n\s*=\s*(\d+)\s*[）)]\s*$/;
function windBandsCard(s) {
  const card = document.createElement('div');
  card.className = 'sec enter';
  const h = document.createElement('h3');
  h.textContent = s.title;
  card.appendChild(h);
  const rows = [];
  (s.content || []).forEach((c) => {
    const m = c.match(WB_RE);
    if (m) {
      rows.push({ band: m[1], avg: m[2], n: m[3] });
    } else {
      const p = document.createElement('p');
      p.textContent = c;
      if (NOTICE_RE.test(c)) p.className = 'notice';
      card.appendChild(p);
    }
  });
  if (rows.length) {
    const t = document.createElement('table');
    t.className = 'wb-table';
    t.innerHTML = '<thead><tr><th>风档</th><th class="num">均环</th><th class="num">n</th></tr></thead>';
    const tb = document.createElement('tbody');
    rows.forEach((r) => {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td>' + esc(r.band) + '</td><td class="num">' + esc(r.avg) +
        '</td><td class="num">' + esc(r.n) + '</td>';
      tb.appendChild(tr);
    });
    t.appendChild(tb);
    card.appendChild(t);
  }
  return card;
}

function adviceCard(suggestions) {
  const card = document.createElement('div');
  card.className = 'advice enter';
  const h = document.createElement('h3');
  h.textContent = '训练建议';
  card.appendChild(h);
  const ul = document.createElement('ul');
  suggestions.forEach((t) => {
    const li = document.createElement('li');
    li.textContent = t;
    ul.appendChild(li);
  });
  card.appendChild(ul);
  return card;
}

/* ---- 建立锚点引导：无锚点时教练可直接从候选场次建锚点 ---- */
function anchorSetupCard(setup) {
  const card = document.createElement('div');
  card.className = 'anchor-setup enter';
  const h = document.createElement('h3');
  h.textContent = '建立锚点';
  card.appendChild(h);
  const p = document.createElement('p');
  p.textContent = setup.reason || '当前无锚点，无法判定方向。';
  card.appendChild(p);
  const cands = setup.candidates || [];
  if (!cands.length) {
    const note = document.createElement('p');
    note.textContent = '暂无可作锚点的场次（需早于当前窗口、含距离信息，且记分箭达最小样本）。';
    card.appendChild(note);
    return card;
  }
  const row = document.createElement('div');
  row.className = 'as-row';
  const sel = document.createElement('select');
  cands.forEach((c) => {
    const o = document.createElement('option');
    o.value = c.session_id;
    o.textContent = (c.session_time_utc || '').slice(0, 10) + ' · ' + (c.distance_m || '?') + 'm · ' +
      (c.scoring_shots || 0) + '箭 · ' + (c.mode_composition || '');
    sel.appendChild(o);
  });
  const btn = document.createElement('button');
  btn.className = 'primary';
  btn.textContent = '建立锚点';
  btn.onclick = () => createAnchor(setup.primary_bow, sel.value, btn);
  row.appendChild(sel);
  row.appendChild(btn);
  card.appendChild(row);
  return card;
}

function createAnchor(bowType, sessionId, btn) {
  if (!athleteId || !sessionId) return;
  btn.disabled = true;
  setStatus('建立锚点…', true);
  api('/api/v1/athletes/' + athleteId + '/baseline/anchor', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ bow_type: bowType, source_session_id: sessionId }),
  }).then(() => {
    setStatus('锚点已建立');
    if (lastRequest) generate(lastRequest);  // 重生成：锚点建立后本窗口应出方向判定
  }).catch((e) => {
    btn.disabled = false;
    setStatus('');
    alert('建立锚点失败：' + e.message);
  });
}

function renderMeta(r) {
  const ce = r.coach_extra || {};
  const items = [];
  if (r.bow_type) items.push(['主弓种', r.bow_type]);
  if (ce.rolling_baseline) {
    items.push(['滚动基线', '最近 ' + ce.rolling_baseline.n_shots + ' 箭 · 均环 ' + ce.rolling_baseline.avg_score]);
  }
  if (ce.warnings && ce.warnings.length) items.push(['警告', ce.warnings.join('；')]);
  if (ce.anchor_rebuild_hint && ce.anchor_rebuild_hint.reason) items.push(['锚点提示', ce.anchor_rebuild_hint.reason]);
  if (r.generated_at_utc) items.push(['生成时间', r.generated_at_utc + '（UTC）']);
  // 逐项 DOM（不再用 textContent + '\n'，否则换行被折叠成一整段）
  $('reportMeta').innerHTML = items.map((it) =>
    '<div class="meta-line"><span class="mk">' + esc(it[0]) + '</span><span class="mv">' + esc(it[1]) + '</span></div>'
  ).join('');
}

function renderReport(r) {
  $('reportEmpty').style.display = 'none';
  $('reportPanel').style.display = '';
  const names = { daily: '日', weekly: '周', monthly: '月', quarterly: '季', yearly: '年' };
  const who = r.athlete ? r.athlete.name : '';
  $('reportHead').innerHTML =
    '<span class="rh-name">' + esc(who) + '</span>' +
    '<span class="rh-sep">·</span>' + esc(names[r.granularity] || r.granularity) + '报告' +
    '<span class="rh-sep">·</span>' + esc(r.window_key) +
    '<span class="rh-sep">·</span>' + (view === 'coach' ? '教练视角' : '运动员视角');

  const byKey = {};
  (r.sections || []).forEach((s) => { byKey[s.key] = s; });

  // ① 成绩：核心数字从句子中提出，做指标块（教练扫数字，不读整句）
  const hero = $('reportHero');
  hero.innerHTML = '';
  const ws = byKey['window_score'];
  if (ws) {
    const line = (ws.content || [])[0] || '';
    const n = (line.match(/[（(]\s*n\s*=\s*(\d+)\s*[）)]/) || [])[1];
    const parsed = parseMetrics(line);
    if (n === '0') {
      // 空窗口：后端文案为 0.00/0.0% 占位，直接呈现会像「测出来的 0」；改显干净空状态
      const el = document.createElement('div');
      el.className = 'hero-empty enter';
      el.textContent = '本窗口无箭';
      hero.appendChild(el);
    } else {
      hero.appendChild(parsed ? metricGrid(parsed) : sectionCard(ws));
    }
  }

  // ② 建议：可执行结论，紧接数字；不再埋在 12px 灰字 meta 里
  const advBox = $('reportAdvice');
  advBox.innerHTML = '';
  const sugg = r.suggestions || [];
  if (sugg.length) {
    const card = adviceCard(sugg);
    card.style.animationDelay = '50ms';
    advBox.appendChild(card);
  }

  // ③ 支撑：水平对比 → 数据完整性 → 风档 → 样本 → 辅助
  const body = $('reportBody');
  body.innerHTML = '';
  ['level', 'data_integrity', 'wind_bands', 'sample_gate', 'auxiliary'].forEach((k, i) => {
    const s = byKey[k];
    if (!s) return;
    const card = (k === 'wind_bands') ? windBandsCard(s) : sectionCard(s);
    card.style.animationDelay = (100 + 40 * i) + 'ms';
    body.appendChild(card);
    // 无锚点引导紧接水平对比段（仅教练视角；动作字段来自 coach_extra）
    if (k === 'level' && view === 'coach') {
      const setup = (r.coach_extra || {}).anchor_setup;
      if (setup && setup.needs_anchor) {
        const ac = anchorSetupCard(setup);
        ac.style.animationDelay = (120 + 40 * i) + 'ms';
        body.appendChild(ac);
      }
    }
  });

  renderMeta(r);
}

function deleteNote(id) {
  api('/api/v1/athletes/' + athleteId + '/notes/' + id, { method: 'DELETE' })
    .then(() => refreshSidePanels())
    .catch((e) => alert('删除失败：' + e.message));
}

function moveThumb(seg) {
  const btns = seg.querySelectorAll('button');
  let idx = 0;
  btns.forEach((b, i) => { if (b.classList.contains('active')) idx = i; });
  const thumb = seg.querySelector('.seg-thumb');
  if (thumb) thumb.style.transform = 'translateX(' + (idx * 100) + '%)';
}

document.querySelectorAll('#viewSwitch button').forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll('#viewSwitch button').forEach((x) => x.classList.remove('active'));
    b.classList.add('active');
    moveThumb($('viewSwitch'));
    view = b.dataset.view;
    refreshSidePanels();
    // 报告正文按视角过滤备注（教练观察仅教练可见），换视角必须重取同一窗口，
    // 否则运动员视图会继续显示教练视角那份正文
    if (lastRequest) generate(lastRequest);
  };
});
moveThumb($('viewSwitch'));
moveThumb($('granSwitch'));

$('athleteSelect').onchange = onAthleteChange;
$('addNoteBtn').onclick = () => {
  const content = $('noteContent').value.trim();
  if (!content || !athleteId) return;
  const authorRole = view === 'coach' ? 'coach' : 'athlete';
  api('/api/v1/athletes/' + athleteId + '/notes', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      note_type: $('noteType').value, content: content,
      author_role: authorRole, actor_id: athleteId,
    }),
  }).then(() => { $('noteContent').value = ''; refreshSidePanels(); })
    .catch((e) => alert('添加失败：' + e.message));
};

loadAthletes();
